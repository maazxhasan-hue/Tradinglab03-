<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Nexora AI Neural HQ</title><style>body{margin:0;background:#03050a;color:#e9edf7;font:16px system-ui;padding:24px}main{max-width:1100px;margin:auto}h1{font-size:clamp(32px,5vw,60px)}.panel{border:1px solid #252b3a;border-radius:12px;padding:18px;background:#090c13}.visual{height:55vh;min-height:300px;border:1px solid #303044;border-radius:10px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:pan-y}b{color:#ff6db4}</style></head><body><main><p>NEXORA <b>AI</b> / NEURAL HQ</p><h1>Build. Deliver. Evolve.</h1><div class="panel"><p>Interactive agent network and shared Brain visualization. Drag or move your pointer to rotate.</p><div class="visual"><canvas id="net"></canvas></div><p id="state">Interactive visualization ready. Visual nodes are illustrative, not live agent counts.</p><p><a style="color:#68f3f0" href="https://tradinglab03.onrender.com/health">Check worker health</a></p></div></main><script>(()=>{const c=document.getElementById("net"),x=c.getContext("2d");let w=1,h=1,rx=0,ry=0,tx=0,ty=0,drag=false,lx=0,ly=0;const pts=Array.from({length:280},(_,i)=>{let a=i*2.399963,r=Math.sqrt((i+.5)/280);return{x:Math.cos(a)*r,y:Math.sin(a)*r,z:Math.sin(i*1.7)*.7}});function size(){let b=c.getBoundingClientRect();w=b.width;h=b.height;c.width=w*(devicePixelRatio||1);c.height=h*(devicePixelRatio||1);x.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0)}function draw(){ry+=(ty-ry)*.04;rx+=(tx-rx)*.04;x.fillStyle="#04050a";x.fillRect(0,0,w,h);let p=pts.map(a=>{let X=a.x*Math.cos(ry)-a.z*Math.sin(ry),Z=a.x*Math.sin(ry)+a.z*Math.cos(ry),Y=a.y*Math.cos(rx)-Z*Math.sin(rx);return{x:w/2+X*Math.min(w,h)*.43/(2.7+Z),y:h/2+Y*Math.min(w,h)*.43/(2.7+Z)}});for(let i=0;i<p.length;i++)for(let j=i+1;j<Math.min(p.length,i+7);j++){let d=Math.hypot(p[i].x-p[j].x,p[i].y-p[j].y);if(d<Math.min(w,h)*.12){x.globalAlpha=.22*(1-d/(Math.min(w,h)*.12));x.strokeStyle=i%2?"#68f3f0":"#ff6db4";x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.stroke()}}x.globalAlpha=1;p.forEach((a,i)=>{x.fillStyle=["#68f3f0","#ff6db4","#ff4d67"][i%3];x.beginPath();x.arc(a.x,a.y,1.4,0,7);x.fill()});requestAnimationFrame(draw)}c.addEventListener("pointermove",e=>{let b=c.getBoundingClientRect();if(drag){ty+=(e.clientX-lx)*.006;tx+=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY}else{ty=(e.clientX-b.left-b.width/2)/b.width;tx=-(e.clientY-b.top-b.height/2)/b.height}});c.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY});c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);new ResizeObserver(size).observe(c);size();draw()})();</script></body></html>
