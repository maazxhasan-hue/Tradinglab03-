<script>
const roles=[
['Growth Director','Leadership'],['Content Strategy Lead','Content & Creative'],['Creative Production Lead','Content & Creative'],['Copywriting Specialist','Content & Creative'],['Short-form Video Specialist','Content & Creative'],['Property Storytelling Specialist','Content & Creative'],['Creative QA Specialist','Content & Creative'],['Lead Intelligence Lead','Lead Intelligence'],['Enquiry Classification Specialist','Lead Intelligence'],['Buyer Intent Specialist','Lead Intelligence'],['Lead Scoring Specialist','Lead Intelligence'],['Lead Research Specialist','Lead Intelligence'],['Qualification & Booking Lead','Qualification & Booking'],['Buyer Qualification Specialist','Qualification & Booking'],['Showing Coordinator','Qualification & Booking'],['Appointment Follow-up Specialist','Qualification & Booking'],['Sales Handoff Specialist','Qualification & Booking'],['Social Distribution Lead','Social Distribution'],['Instagram Specialist','Social Distribution'],['Facebook Specialist','Social Distribution'],['YouTube Shorts Specialist','Social Distribution'],['LinkedIn Specialist','Social Distribution'],['Market & Local Research Lead','Market & Local Research'],['Local Market Research Specialist','Market & Local Research'],['Competitor Research Specialist','Market & Local Research'],['Audience Insights Specialist','Market & Local Research'],['Trend Monitoring Specialist','Market & Local Research'],['CRM & Follow-up Lead','CRM & Follow-up'],['CRM Hygiene Specialist','CRM & Follow-up'],['Follow-up Planning Specialist','CRM & Follow-up'],['Lead Lifecycle Specialist','CRM & Follow-up'],['Retention Specialist','CRM & Follow-up'],['Reputation & Community Lead','Reputation & Community'],['Review Monitoring Specialist','Reputation & Community'],['Community Response Specialist','Reputation & Community'],['Brand Safety Specialist','Reputation & Community'],['Escalation Specialist','Reputation & Community'],['Analytics & Compliance Lead','Analytics & Compliance'],['Campaign Analytics Specialist','Analytics & Compliance'],['Conversion Analytics Specialist','Analytics & Compliance'],['Compliance Review Specialist','Analytics & Compliance'],['Reporting Specialist','Analytics & Compliance']];
const keys=['campaigns','approvals','leads','showings','calls','tasks','activity','knowledge'];const starter={campaigns:[],approvals:[],leads:[],showings:[],calls:[],tasks:[],activity:[],knowledge:[{id:1,title:'Brand voice & verified facts',body:'Use approved facts and a calm, premium tone. Never invent property prices, addresses, amenities, legal claims or returns.'}]};let data;try{data={...starter,...JSON.parse(localStorage.getItem('urban-growth-hq-v1')||'{}')}}catch{data=structuredClone(starter)}let page='Overview',filter='';
const navItems=[['Overview','▦'],['Growth Director HQ','✳'],['Workflow map','⌘'],['Campaign studio','▤'],['Approval queue','✓'],['Lead intelligence','◎'],['Showings & calls','☎'],['Analytics','▥'],['41 AI agents','✣'],['Knowledge base','▣'],['Settings & backup','⚙']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem('urban-growth-hq-v1',JSON.stringify(data));render()};const log=(title,detail)=>data.activity.unshift({id:Date.now(),title,detail,at:new Date().toISOString()});const pending=()=>data.approvals.filter(x=>x.status==='Pending').length;
function btn(label,act,cls='btn'){return '<button class="'+cls+'" data-act="'+act+'">'+label+'</button>'}
function panel(title,sub,inside,tools=''){return '<section class="panel"><div class="panelhead"><div><h2>'+title+'</h2><p class="sub">'+sub+'</p></div>'+tools+'</div>'+inside+'</section>'}
function empty(title,detail){return '<div class="empty">◌<b>'+title+'</b>'+detail+'</div>'}
function metrics(){return '<div class="metrics">'+[['Campaign drafts',data.campaigns.length,'Created in this workspace'],['Awaiting approval',pending(),'Human decision required'],['Active leads',data.leads.filter(x=>!['Won','Lost','Do not contact'].includes(x.status)).length,'Saved lead records'],['Upcoming showings',data.showings.filter(x=>['Scheduled','Confirmed'].includes(x.status)).length,'Scheduled or confirmed']].map(x=>'<div class="metric"><label>'+x[0]+'</label><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join('')+'</div>'}
function workflow(){let stages=[['01','Content Studio','Create property content from verified facts.'],['02','Human Approval','Review every campaign before publication.'],['03','Lead Intelligence','Organise and prioritise recorded enquiries.'],['04','Qualification & Booking','Track appointments and property visits.'],['05','Follow-up & Nurture','Plan next steps; no messages sent automatically.'],['06','Reviews & Referrals','Record reputation tasks for manual review.']];return '<div class="workflow">'+stages.map((s,i)=>'<div class="stage"><div class="n">'+s[0]+'</div><b>'+s[1]+'</b><small>'+s[2]+'</small></div>').join('')+'</div>'}
function activity(){let arr=data.activity.slice(0,6);return arr.length?'<div class="list">'+arr.map(a=>'<div class="item"><span class="dot"></span><div class="itemmain"><b>'+esc(a.title)+'</b><p>'+esc(a.detail)+'</p><p>'+new Date(a.at).toLocaleString('en-IN')+'</p></div></div>').join('')+'</div>':empty('No activity yet','Actions you record in this workspace will appear here.')}
function overview(){return metrics()+'<div class="grid"><div>'+panel('Connected growth workflow','A six-stage operating path for real-estate growth.',workflow(),btn('Run operations scan','scan','btn soft'))+panel('Action centre','Tasks suggested from saved workspace records.',taskList())+'</div><div>'+panel('Growth Director brief','Current workspace status.', '<div class="list"><div class="item"><span class="dot"></span><div class="itemmain"><b>'+pending()+' campaign approvals pending</b><p>Human review is required before publishing.</p></div></div><div class="item"><span class="dot"></span><div class="itemmain"><b>'+data.leads.length+' lead records</b><p>Check consent and contact preferences before outreach.</p></div></div><div class="item"><span class="dot"></span><div class="itemmain"><b>'+roles.length+' specialist roles</b><p>Role directory only; these are not 41 live autonomous agents.</p></div></div></div>')+panel('Recent activity','Latest recorded workspace actions.',activity())+'</div></div>'}
function taskList(){let arr=data.tasks.filter(x=>x.status!=='Done');return arr.length?'<div class="list">'+arr.slice(0,8).map(t=>'<div class="item"><span class="dot"></span><div class="itemmain"><b>'+esc(t.title)+'</b><p>'+esc(t.detail)+'</p><div class="actions"><button class="btn" data-act="done" data-taskid="'+t.id+'">Mark done</button></div></div></div>').join('')+'</div>':empty('Nothing queued','Run the operations scan to create internal recommendations.')}
function table(items,type){if(!items.length)return empty('No records yet','Use the create button to add the first record.');return '<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Details</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+items.filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase())).map(x=>'<tr data-rowid="'+x.id+'" data-rowtype="'+type+'"><td><b>'+esc(x.title||x.name||x.property||'Untitled')+'</b><small>'+new Date(x.createdAt||Date.now()).toLocaleDateString('en-IN')+'</small></td><td>'+esc(x.copy||x.interest||x.body||[x.platform,x.property,x.date,x.time].filter(Boolean).join(' · ')||'—')+'</td><td><span class="tag '+(x.status==='Approved'||x.status==='Won'||x.status==='Completed'?'green':x.status==='Pending'?'amber':'')+'">'+esc(x.status||'New')+'</span></td><td><div class="actions">'+(type==='campaigns'?btn('Request approval','request','btn soft'):type==='approvals'&&x.status==='Pending'?btn('Approve','approve','btn primary')+btn('Reject','reject','btn danger'):type==='leads'?'<select data-status="'+x.id+'"><option>New</option><option>Contacted</option><option>Qualified</option><option>Visit planned</option><option>Won</option><option>Lost</option><option>Do not contact</option></select>':type==='showings'?'<select data-showstatus="'+x.id+'"><option>Scheduled</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select>':'')+btn('Delete','delete btn','btn danger')+'</div></td></tr>').join('')+'</tbody></table></div>'}
function form(type){let fields={campaigns:[['title','Campaign title','text'],['platform','Platform','select:Instagram,Facebook,LinkedIn,YouTube Shorts'],['goal','Goal','select:Awareness,Qualified enquiries,Property showing'],['copy','Draft copy','textarea'],['verifiedFacts','Verified property facts only','textarea']],leads:[['name','Lead name','text'],['phone','Phone (optional)','text'],['interest','Property interest','text'],['source','Source','select:Website,Instagram,Facebook,Referral,Phone,Walk-in,Other'],['consent','Explicit contact consent?','select:Not recorded,Yes,No']],showings:[['name','Buyer name','text'],['property','Property / listing','text'],['date','Date','date'],['time','Time (IST)','time'],['phone','Phone (optional)','text']],calls:[['name','Contact','text'],['outcome','Call outcome','select:Connected,No answer,Callback requested,Not interested,Wrong number'],['nextAction','Next action','text'],['notes','Notes','textarea']],knowledge:[['title','Document title','text'],['body','Verified facts / guidance','textarea']]};return '<form id="recordForm" data-type="'+type+'">'+fields[type].map(f=>'<div class="field"><label>'+f[1]+'</label>'+(f[2].startsWith('select:')?'<select name="'+f[0]+'">'+f[2].slice(7).split(',').map(v=>'<option>'+v+'</option>').join('')+'</select>':f[2]==='textarea'?'<textarea name="'+f[0]+'" required></textarea>':'<input name="'+f[0]+'" type="'+f[2]+'" '+(['title','name','property','copy','body'].includes(f[0])?'required':'')+'></div>').join('')+(type==='leads'?'<div class="field"><label>Contact permission</label><small>Only contact leads when consent and applicable rules permit it. “Do not contact” will be respected in this workspace.</small></div>':'')+'<button class="btn primary">Save record</button></form>'}
function pageBody(){if(page==='Overview'||page==='Growth Director HQ')return overview();if(page==='Workflow map')return panel('Six-stage growth workflow','This is a manual operations checklist, not autonomous execution.',workflow(),btn('Run operations scan','scan','btn primary'))+panel('Latest scan results','Internal recommendations only; no external actions taken.',activity());if(page==='Campaign studio')return panel('Campaign studio','Draft copy, record verified facts, then request approval.',table(data.campaigns,'campaigns'),btn('+ New campaign','new:campaigns','btn primary'));if(page==='Approval queue')return panel('Human approval queue','Approval does not publish content to any external account.',table(data.approvals,'approvals'));if(page==='Lead intelligence')return panel('Lead intelligence & CRM','Record lead intent and contact permissions.',table(data.leads,'leads'),btn('+ Add lead','new:leads','btn primary'));if(page==='Showings & calls')return panel('Showings & call desk','Record appointments and call outcomes; no real calls are placed.', '<div class="toolbar">'+btn('+ Schedule showing','new:showings','btn primary')+btn('+ Log call outcome','new:calls','btn')+'</div><h3>Showings</h3>'+table(data.showings,'showings')+'<h3>Call log</h3>'+table(data.calls,'calls'));if(page==='Analytics')return metrics()+panel('Workspace analytics','Counts are based only on records saved here.', '<div class="list">'+[['Campaigns',data.campaigns.length],['Approved campaigns',data.approvals.filter(x=>x.status==='Approved').length],['Leads marked qualified',data.leads.filter(x=>x.status==='Qualified').length],['Showings completed',data.showings.filter(x=>x.status==='Completed').length],['Recorded calls',data.calls.length],['Open tasks',data.tasks.filter(x=>x.status!=='Done').length]].map(x=>'<div class="item"><div class="itemmain"><b>'+x[0]+'</b></div><span class="tag">'+x[1]+'</span></div>').join(''));if(page==='41 AI agents')return panel('41 specialist roles','These are role definitions, not 41 independently running agents. Connect a secured backend and approved provider before enabling AI execution.', '<div class="agents">'+roles.map((r,i)=>'<div class="agent"><b>'+String(i+1).padStart(2,'0')+' · '+r[0]+'</b><small>'+r[1]+'</small></div>').join('')+'</div>');if(page==='Knowledge base')return panel('Knowledge base','Store approved messaging and verified property facts.',table(data.knowledge,'knowledge'),btn('+ Add document','new:knowledge','btn primary'));if(page==='Settings & backup')return panel('Workspace settings & backup','Records are stored in this browser on this device. Clearing browser storage may erase them.', '<div class="note">No cloud database or login is connected. Export backups regularly and do not enter highly sensitive customer data into this public demo.</div><div class="toolbar">'+btn('Export JSON backup','export','btn primary')+btn('Restore JSON backup','import','btn')+btn('Reset local workspace','reset','btn danger')+'</div><div class="field"><label>Workspace</label><input value="The Urban Builders" disabled></div><div class="field"><label>Currency</label><input value="INR · ₹" disabled></div><div class="field"><label>Timezone</label><input value="Asia/Kolkata · IST" disabled></div>');return overview()}
function render(){document.getElementById('crumb').textContent=page;document.getElementById('nav').innerHTML=navItems.map(([n,i])=>'<button class="'+(n===page?'active':'')+'" data-page="'+n+'"><span class="ico">'+i+'</span>'+n+(n==='Approval queue'&&pending()?'<span class="num">'+pending()+'</span>':'')+'</button>').join('');document.getElementById('content').innerHTML='<div class="welcome"><div><div class="eyebrow">● GROWTH OPERATIONS · INDIA</div><h1>'+({'Overview':'Good day, Urban Builders.','Growth Director HQ':'Growth Director HQ'}[page]||page)+'</h1><p>One workspace for content, enquiries, approvals and property visits.</p></div>'+(['Campaign studio','Lead intelligence','Showings & calls','Knowledge base'].includes(page)?'':'<button class="btn primary" data-act="new:campaigns">＋ Create campaign</button>')+'</div>'+pageBody();document.querySelectorAll('[data-status]').forEach(el=>{el.value=data.leads.find(x=>String(x.id)===el.dataset.status)?.status||'New'});document.querySelectorAll('[data-showstatus]').forEach(el=>{el.value=data.showings.find(x=>String(x.id)===el.dataset.showstatus)?.status||'Scheduled'})}
function scan(){const now=new Date().toISOString();let n=0;const add=(key,title,detail)=>{if(!data.tasks.some(t=>t.key===key&&t.status!=='Done')){data.tasks.unshift({id:Date.now()+n,key,title,detail,status:'Open',createdAt:now});n++}};if(pending())add('approval','Review pending campaign approvals',pending()+' draft(s) await a human decision.');data.leads.filter(x=>!['Won','Lost','Do not contact'].includes(x.status)).slice(0,15).forEach(x=>add('lead-'+x.id,'Review lead: '+(x.name||'New lead'),'Check recorded consent and contact preferences before outreach.'));data.showings.filter(x=>['Scheduled','Confirmed'].includes(x.status||'Scheduled')).slice(0,15).forEach(x=>add('show-'+x.id,'Confirm showing: '+(x.property||'Property visit'),(x.date||'Date not set')+' '+(x.time||'')+' IST'));if(!data.campaigns.some(x=>Date.now()-new Date(x.createdAt).getTime()<7*86400000))add('content','Prepare verified property content','Create a draft using approved facts and route it through human approval.');add('reputation','Review feedback and referral process','Manual review only; no external review platform is connected.');log('Operations scan completed',n+' internal task(s) added. No messages sent or content published.');save();alert('Operations scan complete. '+n+' internal task(s) added. No external actions were taken.')}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;filter='';render();return}let b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;if(act.startsWith('new:')){const type=act.split(':')[1];const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;background:#0b1220aa;display:grid;place-items:center;padding:16px;z-index:9;overflow:auto';box.innerHTML='<div style="background:white;border-radius:15px;padding:22px;width:min(100%,560px);max-height:92vh;overflow:auto"><div class="panelhead"><h2>Create '+type.slice(0,-1)+'</h2><button class="btn" data-close>Close</button></div>'+form(type)+'</div>';document.body.appendChild(box);box.addEventListener('click',ev=>{if(ev.target===box||ev.target.closest('[data-close]'))box.remove()});box.querySelector('form').addEventListener('submit',ev=>{ev.preventDefault();const fd=Object.fromEntries(new FormData(ev.target));const obj={id:Date.now(),createdAt:new Date().toISOString(),status:type==='campaigns'?'Draft':type==='showings'?'Scheduled':type==='knowledge'?'Approved':'New',...fd};if(type==='leads')obj.consent=fd.consent==='Yes';data[type].unshift(obj);log(({campaigns:'Campaign draft created',leads:'Lead added',showings:'Showing scheduled',calls:'Call outcome recorded',knowledge:'Knowledge document added'})[type],obj.title||obj.name||obj.property||'Workspace record');box.remove();page=type==='calls'?'Showings & calls':type==='knowledge'?'Knowledge base':type==='campaigns'?'Campaign studio':type==='leads'?'Lead intelligence':'Showings & calls';save()});return}if(act==='scan'){scan();return}if(act==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='urban-growth-hq-backup.json';a.click();URL.revokeObjectURL(a.href);return}if(act==='import'){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let d=JSON.parse(await i.files[0].text());if(!keys.some(k=>Array.isArray(d[k])))throw Error();data={...starter,...d};save();alert('Backup restored.')}catch{alert('That backup file is not valid.')}};i.click();return}if(act==='reset'){if(confirm('Reset this browser workspace? Export a backup first.')){data=structuredClone(starter);save()}return}if(act==='done'){const t=data.tasks.find(x=>String(x.id)===String(b.dataset.taskid))||data.tasks.find(x=>x.status!=='Done');if(t){t.status='Done';log('Task completed',t.title);save()}return}if(['request','approve','reject','delete'].includes(act)){const tr=b.closest('tr');const title=tr?.querySelector('td b')?.textContent;let collection=tr?.dataset.rowtype|| (page==='Campaign studio'?'campaigns':page==='Approval queue'?'approvals':page==='Lead intelligence'?'leads':page==='Knowledge base'?'knowledge':'showings');let obj=data[collection].find(x=>String(x.id)===String(tr?.dataset.rowid));if(!obj)return;if(act==='request'){if(!obj.copy?.trim()){alert('Add draft copy before requesting approval.');return}if(data.approvals.some(x=>x.campaignId===obj.id&&x.status==='Pending')){alert('Already awaiting approval.');return}data.approvals.unshift({...obj,id:Date.now(),campaignId:obj.id,status:'Pending'});obj.status='Pending approval';log('Approval requested',obj.title)}if(act==='approve'||act==='reject'){obj.status=act==='approve'?'Approved':'Rejected';const original=data.campaigns.find(x=>x.id===obj.campaignId);if(original)original.status=obj.status;log('Campaign '+obj.status.toLowerCase(),obj.title)}if(act==='delete'){if(!confirm('Delete this record?'))return;data[collection]=data[collection].filter(x=>x!==obj)}save();return}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.status){let x=data.leads.find(x=>String(x.id)===el.dataset.status);if(x){x.status=el.value;log('Lead status updated',x.name+' · '+x.status);save()}}if(el.dataset.showstatus){let x=data.showings.find(x=>String(x.id)===el.dataset.showstatus);if(x){x.status=el.value;save()}}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script></body></html>
