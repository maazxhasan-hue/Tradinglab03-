name = "tradinglab03-intake"
main = "index.js"
compatibility_date = "2026-10-16"
workers_dev = true

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "__SITE_ORIGINS__"
NOTIFY_EMAIL = "__NOTIFY_EMAIL__"
FROM_EMAIL = "__FROM_EMAIL__"
GA4_PROPERTY_ID = "__GA4_PROPERTY_ID__"
GA4_MEASUREMENT_ID = "__GA4_MEASUREMENT_ID__"
# All rate-limit thresholds are environment-configurable; defaults are safe fallbacks.
AUTH_IP_LIMIT_PER_WINDOW = "20"
AUTH_ACCOUNT_LIMIT_PER_WINDOW = "8"
AUTH_RATE_WINDOW_SECONDS = "3600"
AUTH_BACKOFF_BASE_SECONDS = "2"
AUTH_BACKOFF_MAX_SECONDS = "300"
PUBLIC_CHAT_LIMIT_PER_WINDOW = "30"
PUBLIC_INTAKE_LIMIT_PER_WINDOW = "12"
PUBLIC_RATE_WINDOW_SECONDS = "3600"
AUTHENTICATED_ACTION_LIMIT_PER_WINDOW = "120"
AUTHENTICATED_RATE_WINDOW_SECONDS = "3600"

[[d1_databases]]
binding = "DB"
database_name = "tradinglab03-intake"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[triggers]
crons = ["15 2 * * *"]
