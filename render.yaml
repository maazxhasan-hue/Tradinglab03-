services:
  - type: web
    name: nexora-harvey-worker
    runtime: docker
    dockerfilePath: ./harvey-worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HARVEY_API_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openrouter/free
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: SHARED_BRAIN_AGENT_KEY
        sync: false
      - key: COMPANY_AUTORUN_ENABLED
        value: "true"
      - key: HQ_ADMIN_PASSWORD
        sync: false
      - key: HQ_SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/harvey.db
    disk:
      name: harvey-data
      mountPath: /var/data
      sizeGB: 1
