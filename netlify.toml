[build]
  publish = "."

[[redirects]]
  from = "/private-hq"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/private-hq/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/owner-console"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/owner-console/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dashboard/index.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dashboard/marketing.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dashboard/inbox.html"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
