<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nexora AI · Service Pricing Admin</title>
<style>:root{color-scheme:dark;--bg:#080d16;--panel:#101a29;--line:#24344a;--text:#edf4ff;--muted:#9aabc1;--cyan:#54e7d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.muted{color:var(--muted)}h1{font-size:clamp(24px,5vw,38px)}.service{display:grid;grid-template-columns:1fr 120px auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}input,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#080f1a;color:var(--text)}button{cursor:pointer;background:var(--cyan);color:#07151a;font-weight:800}.note{border-left:3px solid var(--cyan);padding:10px 14px;background:#10252b}@media(max-width:560px){.service{grid-template-columns:1fr 100px}.service button{grid-column:1/-1}}:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}</style></head>
<body><main class="wrap"><p class="muted">NEXORA AI / OWNER CONSOLE</p><h1>Service pricing</h1><p class="note">Hard cap: ₹499 per service. Changes are validated on the server and saved to the pricing database. This admin page is behind the owner login.</p><p id="status" class="muted">Loading saved prices…</p><section class="card"><div id="services"></div></section><p><a href="/index.html">← Back to HQ</a></p></main>
<script>
"use strict";
const statusEl=document.querySelector("#status"),list=document.querySelector("#services");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{const r=await fetch("/api/pricing/services",{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||"Could not load prices");list.innerHTML=d.services.map(s=>'<div class="service"><div><strong>'+esc(s.name)+'</strong><div class="muted">ID: '+esc(s.service_id)+'</div></div><label>₹ <input aria-label="Price for '+esc(s.name)+'" type="number" min="1" max="499" step="1" value="'+Number(s.price)+'" data-id="'+esc(s.service_id)+'"></label><button type="button" data-save="'+esc(s.service_id)+'">Save price</button></div>').join("");statusEl.textContent="Loaded "+d.services.length+" services · maximum ₹499";list.querySelectorAll("button[data-save]").forEach(b=>b.onclick=()=>save(b.dataset.save));}catch(e){statusEl.textContent="Error: "+e.message;}}
async function save(id){const input=list.querySelector('input[data-id="'+CSS.escape(id)+'"]');const price=Number(input.value);if(!Number.isInteger(price)||price<1||price>499){statusEl.textContent="Price must be a whole number from ₹1 to ₹499.";return;}const b=list.querySelector('button[data-save="'+CSS.escape(id)+'"]');b.disabled=true;try{const r=await fetch("/api/pricing/services/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:id,price})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||"Save failed");input.value=d.service.price;statusEl.textContent="Saved "+d.service.name+" at ₹"+d.service.price+"."; }catch(e){statusEl.textContent="Not saved: "+e.message;}finally{b.disabled=false;}}
load();
</script></body></html>
