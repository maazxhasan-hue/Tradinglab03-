name: Harvey worker tests

on:
  push:
    paths:
      - "harvey-worker/**"
      - "harvey-worker/tests/**"
      - ".github/workflows/harvey-tests.yml"
  pull_request:
    paths:
      - "harvey-worker/**"
      - "harvey-worker/tests/**"
      - ".github/workflows/harvey-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harvey-worker-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harvey-worker/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r harvey-worker/requirements.txt
      - name: Validate MCP config JSON and required Ruflo command
        run: |
          python -c "import json; d=json.load(open('.mcp.json', encoding='utf-8')); s=d['mcpServers']['ruflo']; assert s['command']=='npx' and s['args'][-2:]==['mcp','start']; print('MCP config JSON and command OK')"
      - name: Set up Node.js for Ruflo smoke check
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
      - name: Verify pinned Ruflo release is published
        run: test "$(npm view ruflo@3.59.1 version)" = "3.59.1"
      - name: Run Harvey regression tests
        run: python -m unittest discover -s harvey-worker/tests -p 'test_harvey_worker.py' -v
