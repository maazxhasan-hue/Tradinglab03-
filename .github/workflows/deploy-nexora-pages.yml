name: Deploy Nexora AI Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard/**"
      - "portfolio-sample/**"
      - ".github/workflows/deploy-nexora-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public entry points
        run: |
          test -s index.html
          test -s dashboard/website.html
          test -s dashboard/index.html
          echo "Nexora AI public pages are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
