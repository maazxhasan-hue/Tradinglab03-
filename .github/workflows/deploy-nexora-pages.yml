name: Deploy Nexora AI Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "og-image.svg"
      - "about/**"
      - "blog/**"
      - "pricing/**"
      - "privacy.html"
      - "robots.txt"
      - "sitemap.xml"
      - "portfolio-sample/**"
      - "dashboard/website.html"
      - "dashboard/chat-widget.js"
      - "dashboard/login.html"
      - "dashboard/privacy.html"
      - "dashboard/analytics-consent.js"
      - ".github/workflows/deploy-nexora-pages.yml"
      - ".github/workflows/deploy-intake-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public entry points
        run: |
          set -euo pipefail
          test -s index.html
          test -s dashboard/website.html
          test -s dashboard/chat-widget.js
          test -s dashboard/login.html
          test -s dashboard/analytics-consent.js
          echo "Nexora AI public pages are present."

      - name: Assemble allowlisted public site
        run: |
          set -euo pipefail
          mkdir -p public-site/dashboard
          cp index.html og-image.svg privacy.html robots.txt sitemap.xml public-site/
          cp -R about blog pricing portfolio-sample public-site/
          cp dashboard/website.html dashboard/chat-widget.js dashboard/login.html dashboard/privacy.html dashboard/analytics-consent.js public-site/dashboard/
          test ! -e public-site/private-hq
          test ! -e public-site/harvey-worker
          test ! -e public-site/owner-console
          test ! -e public-site/company
          test ! -e public-site/config
          echo "Only allowlisted public assets will be published."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
