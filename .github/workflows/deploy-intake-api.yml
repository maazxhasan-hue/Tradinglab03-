# Nexora intake deployment workflow; push trigger used to verify configured deployment.
name: Deploy TradingLab03 Intake API

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "dashboard/website.html"
      - "dashboard/login.html"
      - "dashboard/inbox.html"\n      - "dashboard/referrals.html"
      - "private-hq/inbox.html"
      - ".github/workflows/deploy-intake-api.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tradinglab03-intake-deploy
  cancel-in-progress: false

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Detect deployment credentials without exposing them
        id: detect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADINGLAB03_ADMIN_API_KEY: ${{ secrets.TRADINGLAB03_ADMIN_API_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$TRADINGLAB03_ADMIN_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Private deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Intake deployment skipped. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and TRADINGLAB03_ADMIN_API_KEY to repository Actions secrets, then run this workflow again."
          fi
  deploy:
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADINGLAB03_ADMIN_API_KEY: ${{ secrets.TRADINGLAB03_ADMIN_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN in repository Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."; exit 1; }
          test -n "$TRADINGLAB03_ADMIN_API_KEY" || { echo "::error::Add TRADINGLAB03_ADMIN_API_KEY in repository Actions secrets."; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create or reuse D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      result = json.load(res)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:600]
                  raise SystemExit("Cloudflare API " + method + " failed (" + str(exc.code) + "): " + detail)
              if not result.get("success"):
                  raise SystemExit("Cloudflare API returned an unsuccessful result: " + json.dumps(result.get("errors", [])))
              return result.get("result")
          rows = call("GET", "/accounts/" + account + "/d1/database") or []
          db = next((item for item in rows if item.get("name") == "tradinglab03-intake"), None)
          if db is None:
              db = call("POST", "/accounts/" + account + "/d1/database", {"name": "tradinglab03-intake"})
          database_id = db.get("uuid") or db.get("id")
          if not database_id:
              raise SystemExit("Cloudflare created/found the database but did not return an ID.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("database_id=" + database_id + "\n")
          print("D1 database ready: tradinglab03-intake")
          PY
      - name: Build Wrangler configuration
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          SITE_ORIGINS: ${{ vars.TRADINGLAB03_SITE_ORIGINS || 'https://tradinglab03.vercel.app,https://nexora-ai-sooty-two.vercel.app,https://maazxhasan-hue.github.io' }}
          NOTIFY_EMAIL: ${{ vars.TRADINGLAB03_NOTIFY_EMAIL }}
          FROM_EMAIL: ${{ vars.TRADINGLAB03_FROM_EMAIL || 'onboarding@resend.dev' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          template = pathlib.Path("worker/wrangler.template.toml").read_text(encoding="utf-8")
          values = {
              "__D1_DATABASE_ID__": os.environ["D1_DATABASE_ID"],
              "__SITE_ORIGINS__": ",".join(dict.fromkeys([origin.strip().rstrip("/") for origin in os.environ["SITE_ORIGINS"].split(",") if origin.strip()] + ["https://nexora-ai-public.netlify.app"]),),
              "__NOTIFY_EMAIL__": os.environ.get("NOTIFY_EMAIL", ""),
              "__FROM_EMAIL__": os.environ.get("FROM_EMAIL", "")
          }
          for marker, value in values.items():
              template = template.replace('"' + marker + '"', json.dumps(value))
          pathlib.Path("worker/wrangler.toml").write_text(template, encoding="utf-8")
          print("Generated deployment config for the configured site origin.")
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply database migrations
        run: npx --yes wrangler@4 d1 migrations apply tradinglab03-intake --remote --config worker/wrangler.toml
      - name: Verify client authentication tables exist
        run: |
          npx --yes wrangler@4 d1 execute tradinglab03-intake --remote --config worker/wrangler.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('submissions','client_accounts','client_sessions','client_auth_attempts','referrals','referral_commissions','referral_audit_log') ORDER BY name;"
      - name: Configure owner-only access key
        env:
          TRADINGLAB03_ADMIN_API_KEY: ${{ secrets.TRADINGLAB03_ADMIN_API_KEY }}
        run: printf '%s' "$TRADINGLAB03_ADMIN_API_KEY" | npx --yes wrangler@4 secret put ADMIN_API_KEY --config worker/wrangler.toml
      - name: Configure optional email notifications
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY --config worker/wrangler.toml
          else
            echo "RESEND_API_KEY is not configured; enquiries will still be saved but no email alert will be sent."
          fi
      - name: Deploy Worker and capture endpoint
        id: worker
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config worker/wrangler.toml 2>&1 | tee /tmp/tradinglab03-worker-deploy.log
          python - <<'PY'
          import os, pathlib, re
          log = pathlib.Path("/tmp/tradinglab03-worker-deploy.log").read_text(encoding="utf-8", errors="replace")
          urls = re.findall(r"https://[a-zA-Z0-9.-]+\.workers\.dev", log)
          if not urls:
              raise SystemExit("Worker deploy succeeded but no workers.dev URL was detected. Check the Wrangler output and set the endpoint manually.")
          endpoint = urls[-1].rstrip("/")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("endpoint=" + endpoint + "\n")
          print("Worker endpoint detected.")
          PY
      - name: Wire endpoint into the public website
        env:
          INTAKE_ENDPOINT: ${{ steps.worker.outputs.endpoint }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          endpoint = os.environ["INTAKE_ENDPOINT"]
          for filename in ("dashboard/website.html", "private-hq/inbox.html"):
              path = pathlib.Path(filename)
              html = path.read_text(encoding="utf-8")
              updated, count = re.subn(r'data-intake-endpoint="[^"]*"', 'data-intake-endpoint="' + endpoint + '"', html, count=1)
              if count != 1:
                  raise SystemExit("Could not find the intake endpoint setting in " + filename)
              path.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/website.html private-hq/inbox.html
          git diff --cached --quiet || { git commit -m "Connect public website to intake service"; git push origin HEAD:main; }
      - name: Verify intake health endpoint
        env:
          INTAKE_ENDPOINT: ${{ steps.worker.outputs.endpoint }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          url = os.environ["INTAKE_ENDPOINT"].rstrip("/") + "/health"
          headers = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (compatible; TradingLab03-HealthCheck/1.0)"
          }
          last_error = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as res:
                      body = json.load(res)
                      if res.status == 200 and body.get("ok") is True and body.get("storage") == "ready":
                          print("Intake API and D1 health check passed.")
                          break
                      raise SystemExit("Intake health check did not confirm storage readiness.")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:300]
                  last_error = f"HTTP {exc.code}: {detail}"
              except Exception as exc:
                  last_error = str(exc)
              if attempt < 2:
                  print(f"Health check attempt {attempt + 1} failed; retrying: {last_error}")
                  time.sleep(3)
          else:
              raise SystemExit("Intake health check failed after 3 attempts: " + str(last_error))
          PY
      - name: Verify live website AI chat
        env:
          INTAKE_ENDPOINT: ${{ steps.worker.outputs.endpoint }}
          SITE_ORIGINS: ${{ vars.TRADINGLAB03_SITE_ORIGINS || 'https://tradinglab03.vercel.app,https://nexora-ai-sooty-two.vercel.app,https://maazxhasan-hue.github.io' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          endpoint = os.environ["INTAKE_ENDPOINT"].rstrip("/")
          origin = os.environ["SITE_ORIGINS"].split(",")[0].strip().rstrip("/")
          payload = {"message": "Reply with a brief greeting for a Nexora website visitor.", "history": []}
          request = urllib.request.Request(
              endpoint + "/api/chat",
              data=json.dumps(payload).encode(),
              headers={"Accept": "application/json", "Origin": origin, "Content-Type": "application/json", "User-Agent": "Nexora-AI-Chat-Smoke/1.0"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=35) as response:
                  body = json.load(response)
                  if response.status != 200 or not isinstance(body.get("reply"), str) or len(body["reply"].strip()) < 2:
                      raise SystemExit("Live AI chat did not return a usable reply.")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")[:400]
              raise SystemExit("Live AI chat returned HTTP " + str(exc.code) + ": " + detail)
          print("PASS: live website AI chat returned a non-empty reply.")
          PY
      - name: End-to-end synthetic enquiry save and cleanup
        env:
          INTAKE_ENDPOINT: ${{ steps.worker.outputs.endpoint }}
          TRADINGLAB03_ADMIN_API_KEY: ${{ secrets.TRADINGLAB03_ADMIN_API_KEY }}
          SITE_ORIGINS: ${{ vars.TRADINGLAB03_SITE_ORIGINS || 'https://tradinglab03.vercel.app,https://nexora-ai-sooty-two.vercel.app,https://maazxhasan-hue.github.io' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, uuid
          endpoint = os.environ["INTAKE_ENDPOINT"].rstrip("/")
          origin = os.environ["SITE_ORIGINS"].split(",")[0].strip().rstrip("/")
          admin_key = os.environ["TRADINGLAB03_ADMIN_API_KEY"]
          tag = uuid.uuid4().hex[:12]
          payload = {
              "schema_version": 1,
              "source": "Nexora automated synthetic end-to-end test",
              "created_at": "2026-01-01T00:00:00Z",
              "name": "Nexora Synthetic QA",
              "email": "nexora-qa-" + tag + "@example.invalid",
              "company": "Automated Test — Not a Real Client",
              "service": "Business website",
              "budget": "Synthetic test only",
              "deadline": "",
              "goal": "Automated end-to-end test to verify enquiry storage and private inbox retrieval.",
              "reference": "",
              "website": "",
              "consent": True
          }
          def request(method, path, body=None, headers=None):
              merged = {"Accept": "application/json", "Origin": origin, "User-Agent": "Nexora-E2E-Test/1.0"}
              if headers: merged.update(headers)
              data = None if body is None else json.dumps(body).encode()
              if data is not None: merged["Content-Type"] = "application/json"
              req = urllib.request.Request(endpoint + path, data=data, headers=merged, method=method)
              with urllib.request.urlopen(req, timeout=20) as res:
                  return res.status, json.load(res)
          try:
              auth_status, auth = request("POST", "/api/auth/register", {"email": "nexora-qa-" + tag + "@example.invalid", "password": "Synthetic-QA-" + uuid.uuid4().hex + "-Only"})
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")[:500]
              raise SystemExit("Client registration returned HTTP " + str(exc.code) + ": " + detail)
          if auth_status != 200 or auth.get("ok") is not True or not auth.get("token"):
              raise SystemExit("Client registration endpoint did not create a synthetic test session: " + json.dumps(auth)[:500])
          client_token = auth["token"]
          status, saved = request("POST", "/api/intake", payload, headers={"Authorization": "Bearer " + client_token})
          if status != 201 or saved.get("ok") is not True or not saved.get("reference_id"):
              raise SystemExit("Synthetic authenticated enquiry was not confirmed saved.")
          submission_id = saved["reference_id"]
          try:
              try:
                  request("POST", "/api/intake", payload)
                  raise SystemExit("Security check failed: anonymous project submission was accepted.")
              except urllib.error.HTTPError as exc:
                  if exc.code != 401:
                      raise SystemExit("Anonymous project submission returned HTTP " + str(exc.code) + " instead of 401.")
              print("PASS: anonymous project submissions are rejected.")
              status, inbox = request("GET", "/api/admin/submissions?limit=100", headers={"Authorization": "Bearer " + admin_key})
              rows = inbox.get("submissions", [])
              if status != 200 or not any(row.get("id") == submission_id for row in rows):
                  raise SystemExit("Synthetic enquiry was saved but not found in the private inbox.")
              print("PASS: synthetic enquiry saved and visible in private inbox.")
              try:
                  request("PATCH", "/api/admin/submissions/" + submission_id + "/status", {"status": "qualified"})
                  raise SystemExit("Security check failed: unauthenticated status update was accepted.")
              except urllib.error.HTTPError as exc:
                  if exc.code != 401:
                      raise SystemExit("Security check failed: unauthenticated status update returned HTTP " + str(exc.code))
              print("PASS: unauthenticated status update was rejected.")
              try:
                  request(
                      "PATCH",
                      "/api/admin/submissions/" + submission_id + "/status",
                      {"status": "paid"},
                      headers={"Authorization": "Bearer " + admin_key}
                  )
                  raise SystemExit("Validation check failed: unsupported status was accepted.")
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise SystemExit("Validation check failed: unsupported status returned HTTP " + str(exc.code))
              print("PASS: unsupported status was rejected.")
              status, updated = request(
                  "PATCH",
                  "/api/admin/submissions/" + submission_id + "/status",
                  {"status": "qualified"},
                  headers={"Authorization": "Bearer " + admin_key}
              )
              if status != 200 or updated.get("updated") is not True or updated.get("status") != "qualified":
                  raise SystemExit("Authenticated pipeline status update did not return the expected result.")
              status, inbox = request("GET", "/api/admin/submissions?limit=100", headers={"Authorization": "Bearer " + admin_key})
              rows = inbox.get("submissions", [])
              matching = next((row for row in rows if row.get("id") == submission_id), None)
              if status != 200 or not matching or matching.get("status") != "qualified":
                  raise SystemExit("Updated pipeline status was not persisted in the private inbox.")
              print("PASS: authenticated status update persisted and was visible in the inbox.")
              notification = saved.get("notification", "unknown")
              print("EMAIL_NOTIFICATION_STATUS=" + str(notification))
              if notification != "owner_notified":
                  print("::warning::The enquiry was saved, but Resend did not confirm the owner notification. Check sender verification, recipient restrictions, and Resend logs.")
          finally:
              status, deleted = request("DELETE", "/api/admin/submissions/" + submission_id, headers={"Authorization": "Bearer " + admin_key})
              if status != 200 or deleted.get("deleted") is not True:
                  raise SystemExit("Cleanup failed for synthetic test enquiry " + submission_id + ". Remove it from the private inbox.")
          try:
              request("POST", "/api/auth/logout", headers={"Authorization": "Bearer " + client_token})
          except Exception:
              pass
          print("PASS: synthetic enquiry removed after verification. No real client data was used.")
          PY
