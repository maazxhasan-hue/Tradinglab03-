name: Daily Encrypted D1 Backup

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-encrypted-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backup configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Daily backup is NOT configured. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BACKUP_ENCRYPTION_PASSPHRASE to repository Actions secrets."
            exit 1
          fi
      - name: Create temporary Wrangler configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database",
              headers={"Authorization": "Bearer " + token}
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              data = json.load(res)
          if not data.get("success"):
              raise SystemExit("Could not list D1 databases; backup aborted.")
          db = next((x for x in data.get("result", []) if x.get("name") == "tradinglab03-intake"), None)
          if not db:
              raise SystemExit("Expected D1 database tradinglab03-intake was not found; backup aborted.")
          config = {
            "name": "tradinglab03-intake",
            "main": "worker/index.js",
            "compatibility_date": "2026-10-16",
            "workers_dev": True,
            "d1_databases": [{"binding":"DB","database_name":"tradinglab03-intake","database_id":db.get("uuid") or db.get("id")}]
          }
          with open("wrangler.backup.json", "w", encoding="utf-8") as f:
              json.dump(config, f)
          print("Found expected D1 database; no database contents were printed.")
          PY
      - name: Export complete remote database
        run: npx --yes wrangler@4 d1 export tradinglab03-intake --remote --output=database-backup.sql --config=wrangler.backup.json
      - name: Encrypt and verify backup archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -s database-backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -salt -in database-backup.sql -out "nexora-d1-backup-$(date -u +%Y%m%dT%H%M%SZ).sql.enc" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          encrypted="$(find . -maxdepth 1 -name 'nexora-d1-backup-*.sql.enc' -print -quit)"
          test -n "$encrypted"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$encrypted" -out /tmp/backup-verify.sql -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          cmp database-backup.sql /tmp/backup-verify.sql
          sha256sum "$encrypted" > "$encrypted.sha256"
          rm -f database-backup.sql /tmp/backup-verify.sql wrangler.backup.json
          echo "Encrypted full database export verified; plaintext export removed."
      - name: Upload encrypted backup (30-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: nexora-d1-encrypted-backup-${{ github.run_id }}
          path: |
            nexora-d1-backup-*.sql.enc
            nexora-d1-backup-*.sql.enc.sha256
          if-no-files-found: error
          retention-days: 30
