name: Company Health Monitor

on:
  schedule:
    # Offset from the top of the hour to reduce scheduled-run congestion.
    - cron: "11,41 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/company-health-monitor.yml"
      - "company/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: company-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out company repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run company tests
        run: python -m unittest discover -s tests -v

      - name: Check public HQ website
        env:
          SITE_URL: https://maazxhasan-hue.github.io/Tradinglab03-/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            --user-agent "TradingLab03-HealthMonitor/1.0" \
            "$SITE_URL" --output /tmp/company-hq.html
          test -s /tmp/company-hq.html
          if ! grep -Eiq '<title[^>]*>.*(Trading|BotLab|Company|HQ)' /tmp/company-hq.html; then
            echo "::warning::Site responded, but the expected title was not detected. Review the deployed homepage."
          fi
          echo "HQ website returned HTTP success and non-empty HTML."

      - name: Record monitor timestamp
        if: always()
        run: |
          echo "Health check completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ') UTC"
