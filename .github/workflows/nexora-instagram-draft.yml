name: Nexora Instagram Draft Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexora-instagram-draft.yml"
      - "company/instagram_content_pack.py"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate Nexora service content drafts
        run: |
          python company/instagram_content_pack.py --account nexora_ai --topic "Practical AI automation and websites for small businesses" --offer "Nexora AI builds websites and practical AI-assisted business workflows; scope and pricing confirmed before work begins" --audience "small businesses, creators, and local service providers" --cta "Tell us what task you want to simplify and visit the Nexora website to enquire."
      - name: Upload review-only drafts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-instagram-drafts-${{ github.run_id }}
          path: data/instagram_content_packs/
          if-no-files-found: error
          retention-days: 14
