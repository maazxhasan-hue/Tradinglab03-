name: Secret and Credential Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan tracked files and Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-boundary:
    name: Check frontend secret exposure boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify environment files are ignored and examples are placeholders
        shell: bash
        run: |
          set -euo pipefail
          git check-ignore -q .env
          git check-ignore -q .env.local
          git check-ignore -q .env.production
          test -f .env.example
          if grep -nE '^[[:space:]]*(OPENAI_API_KEY|GEMINI_API_KEY|API_KEY|ACCESS_TOKEN|SECRET_KEY|PASSWORD)=.+[^[:space:]]' .env.example; then
            echo "::error::.env.example must not contain populated credential values."
            exit 1
          fi
      - name: Reject known credential formats in public assets
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for path in index.html admin.html pay.html dashboard public-site worker; do
            if [[ -e "$path" ]]; then paths+=("$path"); fi
          done
          if (("${#paths[@]}" == 0)); then
            echo "::error::No expected frontend/public asset paths were found; refusing to silently skip the scan."
            exit 1
          fi

          credential_pattern='(AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
          if grep -RInE --exclude='*.svg' --exclude='*.map' "$credential_pattern" "${paths[@]}"; then
            echo "::error::Potential credential found in frontend/public assets. Remove it and rotate the credential."
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then exit "$status"; fi
          fi

          public_env_pattern='(VITE_[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)|NEXT_PUBLIC_[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD))'
          if grep -RInE --include='*.html' --include='*.js' --include='*.mjs' --include='*.ts' "$public_env_pattern" "${paths[@]}"; then
            echo "::error::Potential secret-bearing public environment variable found in frontend assets."
            exit 1
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then exit "$status"; fi
          fi
