name: Harvey Agent Live Smoke

on:
  push:
    branches: [main]
    paths:
      - "tests/harvey_agent_live_smoke.py"
      - ".github/workflows/harvey-agent-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harvey-agent-live-smoke
  cancel-in-progress: false

jobs:
  live-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run one bounded production specialist task
        env:
          HARVEY_API_KEY: ${{ secrets.HARVEY_API_KEY }}
          HARVEY_WORKER_URL: https://nexora-harvey-worker.onrender.com
        run: |
          set +x
          if [ -z "${HARVEY_API_KEY:-}" ]; then
            echo "::error::Cannot verify live agent execution: configure HARVEY_API_KEY in GitHub Actions secrets. No execution evidence was produced."
            exit 1
          fi
          python tests/harvey_agent_live_smoke.py
