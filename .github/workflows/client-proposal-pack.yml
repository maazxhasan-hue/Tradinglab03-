name: Free Client Proposal Pack

on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: Optional saved lead ID (only client-project leads qualify)
        required: false
        type: string
      business_name:
        description: Business or client name (leave default when using lead_id)
        required: false
        type: string
        default: 'TradingLab03 Demo Business (sample only)'
      website_url:
        description: Public website URL, if available
        required: false
        type: string
      service:
        description: Service to prepare a draft for
        required: true
        type: choice
        options:
          - business_website
          - landing_page
          - website_audit
          - seo_content
          - short_video
          - business_automation
      observed_need:
        description: Specific need or project brief (leave default when using lead_id)
        required: false
        type: string
        default: 'DEMO ONLY: sample website brief for workflow verification; not a real prospect or verified opportunity.'
      evidence:
        description: Human-verified evidence or leave blank
        required: false
        type: string
      price_quote:
        description: Optional operator-entered draft quote; leave blank to avoid pricing
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-client-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out TradingLab03 company project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate proposal inputs
        env:
          CLIENT_LEAD_ID: ${{ inputs.lead_id }}
          CLIENT_BUSINESS: ${{ inputs.business_name }}
          CLIENT_NEED: ${{ inputs.observed_need }}
        run: |
          if [ -n "$CLIENT_LEAD_ID" ]; then
            echo "Using saved lead ID: $CLIENT_LEAD_ID"
          elif [ -n "$CLIENT_BUSINESS" ] && [ -n "$CLIENT_NEED" ]; then
            echo "Using manually supplied business details."
          else
            echo "No lead or business details supplied. Generating a clearly labeled DEMO sample so the workflow can be verified safely."
            echo "CLIENT_BUSINESS=TradingLab03 Demo Business (sample only)" >> "$GITHUB_ENV"
            echo "CLIENT_NEED=DEMO ONLY: sample website brief used to verify the proposal workflow. This is not a real prospect or verified opportunity." >> "$GITHUB_ENV"
            echo "CLIENT_EVIDENCE=Workflow test sample; not a real lead. Do not contact anyone based on this draft." >> "$GITHUB_ENV"
            echo "CLIENT_SERVICE=business_website" >> "$GITHUB_ENV"
          fi
      - name: Generate proposal and outreach drafts without paid APIs
        env:
          CLIENT_LEAD_ID: ${{ inputs.lead_id }}
          CLIENT_BUSINESS: ${{ inputs.business_name }}
          CLIENT_WEBSITE: ${{ inputs.website_url }}
          CLIENT_SERVICE: ${{ inputs.service }}
          CLIENT_NEED: ${{ inputs.observed_need }}
          CLIENT_EVIDENCE: ${{ inputs.evidence }}
          CLIENT_PRICE: ${{ inputs.price_quote }}
        run: python -m company.client_pipeline
      - name: Upload drafts for human review
        uses: actions/upload-artifact@v4
        with:
          name: tradinglab03-client-pack-${{ github.run_id }}
          path: data/client_packs/
          if-no-files-found: error
          retention-days: 14
