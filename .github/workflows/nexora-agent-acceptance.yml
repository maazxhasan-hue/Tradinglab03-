name: Nexora agent acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/shared-provider-rate-limit-backoff]

permissions:
  contents: read

jobs:
  agent-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Nexora mocked acceptance tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_nexora_*.py" -v
