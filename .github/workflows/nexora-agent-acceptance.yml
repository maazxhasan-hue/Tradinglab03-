name: Nexora agent acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/shared-provider-rate-limit-backoff, fix/nexora-ci-security-gates]

permissions:
  contents: read

jobs:
  agent-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run Nexora mocked acceptance tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_nexora_*.py" -v
