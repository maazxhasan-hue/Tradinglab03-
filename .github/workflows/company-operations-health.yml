name: Company Operations Health Check

on:
  schedule:
    - cron: "43 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: company-operations-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out company repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run project tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Check company workflow configuration and recent scout activity
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTS_OK: ${{ steps.tests.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, datetime, pathlib
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          now = datetime.datetime.now(datetime.timezone.utc)
          headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}", "X-GitHub-Api-Version": "2022-11-28"}
          def get(path):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/{path}", headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          workflows = get("actions/workflows")
          runs = get("actions/workflows/hourly-opportunity-scout.yml/runs?per_page=10")
          active = [w for w in workflows.get("workflows", []) if w.get("state") == "active"]
          scout_runs = runs.get("workflow_runs", [])
          latest = scout_runs[0] if scout_runs else None
          successful = next((r for r in scout_runs if r.get("conclusion") == "success"), None)
          def age_hours(run):
              if not run: return None
              stamp = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              return round((now-stamp).total_seconds()/3600, 2)
          age = age_hours(successful)
          tests_ok = os.environ.get("TESTS_OK", "false") == "true"
          status = "HEALTHY" if tests_ok and age is not None and age <= 6 else "NEEDS_ATTENTION"
          lines = [
            "# Company Operations Health Check",
            "",
            f"- Checked at (UTC): {now.isoformat()}",
            f"- Overall status: **{status}**",
            f"- Unit tests: {'PASS' if tests_ok else 'FAIL'}",
            f"- Active workflows: {len(active)}",
            f"- Latest scout run: {latest.get('html_url','none') if latest else 'none'}",
            f"- Latest scout conclusion: {latest.get('conclusion','in_progress') if latest else 'no runs found'}",
            f"- Most recent successful scout age: {age if age is not None else 'unknown'} hours",
            "",
            "## Interpretation",
            "- This is a scheduled health check, not a continuously running worker.",
            "- GitHub Actions may delay or skip scheduled runs under platform load or inactivity.",
            "- A successful scout only proves that the configured public-listing workflow ran; it does not prove clients, proposals, revenue, or every department is active.",
            "- No client contact, bid submission, spending, trading, or production deployment is performed by this check.",
          ]
          pathlib.Path("company-health-report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={status}\n")
          PY
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-health-${{ github.run_id }}
          path: company-health-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Fail run when checks need attention
        if: steps.tests.outcome != 'success' || steps.health.outputs.status != 'HEALTHY'
        run: |
          echo "Company operations health check needs attention; see report artifact."
          exit 1
