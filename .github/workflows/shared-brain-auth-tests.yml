name: Shared Brain Auth Tests

on:
  pull_request:
    paths:
      - "supabase/functions/shared-brain/**"
      - ".github/workflows/shared-brain-auth-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/shared-brain/**"
      - ".github/workflows/shared-brain-auth-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x
      - name: Type-check shared brain Edge Function
        run: deno check supabase/functions/shared-brain/index.ts
      - name: Verify GitHub OIDC validation
        run: deno test supabase/functions/shared-brain/auth_test.ts
