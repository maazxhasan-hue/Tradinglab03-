name: Company Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "company/**"
      - "tests/**"
      - "config/**"
      - "dashboard/**"
      - "private-hq/**"
      - "worker/**"
      - "harvey-worker/**"
      - "vercel.json"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/deploy-intake-api.yml"
      - ".github/workflows/company-quality.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate security configuration and private-hosting safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          routes = config.get("routes", [])
          assert any(
              route.get("src") == "^/(private-hq|owner-console)(/.*)?$"
              and route.get("status") == 404
              for route in routes
          ), "Missing public-site private-path 404 rule"
          assert routes and routes[-1].get("handle") == "filesystem", "Filesystem handler must remain last"
          headers = {
              header.get("key"): header.get("value")
              for group in config.get("headers", [])
              for header in group.get("headers", [])
          }
          for key, expected in {
              "X-Content-Type-Options": "nosniff",
              "X-Frame-Options": "DENY",
              "Referrer-Policy": "strict-origin-when-cross-origin",
          }.items():
              assert headers.get(key) == expected, f"Missing or incorrect security header: {key}"
          print("Legacy path guard configuration and baseline security headers passed.")
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q company tests
      - name: Set up Node.js for browser and Worker syntax checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax-check browser scripts and intake Worker
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          pages = [pathlib.Path("dashboard/website.html"), pathlib.Path("private-hq/index.html"), pathlib.Path("private-hq/inbox.html"), pathlib.Path("private-hq/marketing.html")]
          for page in pages:
              html = page.read_text(encoding="utf-8")
              script_blocks = re.findall(r"<script([^>]*)>(.*?)</script>", html, re.I | re.S)
              scripts = [body for attrs, body in script_blocks if not re.search(r"""type\s*=\s*[\'"]application/ld\+json[\'"]""", attrs, re.I)]
              if not scripts:
                  raise SystemExit("No inline scripts found in " + str(page))
              for index, script in enumerate(scripts):
                  path = pathlib.Path("/tmp") / (page.stem + "-" + str(index) + ".js")
                  path.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
          worker = pathlib.Path("worker/index.js").read_text(encoding="utf-8")
          subprocess.run(["node", "--input-type=module", "--check"], input=worker, text=True, check=True)
          for name in ("index.html", "marketing.html", "inbox.html"):
              page = pathlib.Path("dashboard") / name
              content = page.read_text(encoding="utf-8").lower()
              if "vercel.app" in content or "location.replace" in content:
                  raise SystemExit(f"Retired Vercel redirect remains in {page}")
          inbox = pathlib.Path("dashboard/inbox.html").read_text(encoding="utf-8").lower()
          if "fetch(" in inbox or "api-key" in inbox or "/api/admin/submissions" in inbox:
              raise SystemExit("Public owner inbox must not include the interactive private inbox application")
          print("Public legacy pages contain no retired Vercel redirects or private inbox code.")
          print("Browser JavaScript and Worker module syntax passed.")
          PY
      - name: Run intake Worker behavior tests
        run: node --test worker/test_worker.mjs
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Build sample website and enforce quality gate
        run: python -m company.website_pipeline --brief config/website_brief.example.json --output data/website_drafts/quality-gate
      - name: Upload sample site and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinglab03-quality-site-${{ github.run_id }}
          path: data/website_drafts/quality-gate/
          if-no-files-found: warn
          retention-days: 7
