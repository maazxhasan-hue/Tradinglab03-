name: Company Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "company/**"
      - "tests/**"
      - "config/**"
      - "dashboard/**"
      - ".github/workflows/company-quality.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q company tests
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Build sample website and enforce quality gate
        run: python -m company.website_pipeline --brief config/website_brief.example.json --output data/website_drafts/quality-gate
      - name: Upload sample site and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinglab03-quality-site-${{ github.run_id }}
          path: data/website_drafts/quality-gate/
          if-no-files-found: warn
          retention-days: 7
