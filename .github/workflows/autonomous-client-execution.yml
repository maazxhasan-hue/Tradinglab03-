name: Autonomous Client Execution
on:
  workflow_dispatch:
    inputs:
      brief_json:
        description: Synthetic Nexora QA brief (edit only when testing a different project)
        required: false
        type: string
        default: '{"business_name":"Nexora Synthetic Test Studio","tagline":"Synthetic QA project","service":"business_website","services":["Business website","Responsive design","Contact page"],"observed_need":"Validate automated client delivery, artifact generation, specialist passes, and QA reporting using a fictional business.","target_audience":"Synthetic test users","pages_screens_deliverables":["Home page","Services page","Contact page"],"version_1_must_have_features":["Responsive layout","Accessible navigation","Clear calls to action","Contact form design"],"acceptance_criteria":["Delivery bundle generated","Regression tests pass","QA report produced","Execution report records completed and blocked steps","Review artifact uploaded"],"constraints_dependencies_exclusions":["Synthetic test only","No customer contact","No emails","No production deployment","No trading infrastructure"]}'
      output_name:
        description: Short label for the review bundle (letters, digits, hyphens only)
        required: true
        default: nexora-synthetic-qa
        type: string
permissions:
  contents: read
jobs:
  execute-supported-work:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate input and write brief
        env:
          BRIEF_JSON: ${{ inputs.brief_json }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          raw = os.environ["BRIEF_JSON"]
          try:
              brief = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"brief_json must be valid JSON: {exc}")
          if not isinstance(brief, dict):
              raise SystemExit("brief_json must be a JSON object")
          label = os.environ["OUTPUT_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9-]{1,60}", label):
              raise SystemExit("output_name may contain only letters, digits, and hyphens")
          Path("data").mkdir(exist_ok=True)
          Path("data/autonomous_client_brief.json").write_text(json.dumps(brief, ensure_ascii=False), encoding="utf-8")
          Path("data/autonomous_output_name.txt").write_text(label, encoding="utf-8")
          PY
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute supported delivery steps and create traceability report
        run: |
          OUTPUT_NAME="$(cat data/autonomous_output_name.txt)"
          python -m company.autonomous_delivery --brief data/autonomous_client_brief.json --output "data/client_executions/$OUTPUT_NAME"
      - name: Attempt bounded tool-using agent pass
        if: always()
        env:
          SHARED_BRAIN_AGENT_KEY: ${{ secrets.SHARED_BRAIN_AGENT_KEY }}
          SHARED_BRAIN_AGENT_ID: github-autonomous-client-execution
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ ! -f data/autonomous_client_brief.json ]; then
            echo "Brief unavailable; skipping model pass."
            exit 0
          fi
          OUTPUT_NAME="$(cat data/autonomous_output_name.txt)"
          WORKSPACE="data/client_executions/$OUTPUT_NAME"
          python -m company.tool_agent --brief data/autonomous_client_brief.json --workspace "$WORKSPACE"
          # Retry with OpenAI if Gemini fails and the OpenAI secret is available.
          if [ "${AI_PROVIDER}" = "gemini" ] && [ -n "$OPENAI_API_KEY" ]; then
            if python - "$WORKSPACE/agent_run_report.json" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              r=json.loads(Path(sys.argv[1]).read_text())
              raise SystemExit(0 if r.get("status")=="completed" and int(r.get("tool_calls",0) or 0)>0 else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              echo "Gemini main-agent pass completed; no fallback needed."
            else
              echo "Gemini main-agent pass did not complete; retrying with OpenAI."
              AI_PROVIDER=openai python -m company.tool_agent --brief data/autonomous_client_brief.json --workspace "$WORKSPACE"
            fi
          fi
      - name: Run role-specific specialist passes
        if: always()
        env:
          SHARED_BRAIN_AGENT_KEY: ${{ secrets.SHARED_BRAIN_AGENT_KEY }}
          SHARED_BRAIN_AGENT_ID: github-specialist-orchestrator
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ ! -f data/autonomous_client_brief.json ]; then
            echo "Brief unavailable; skipping specialist passes."
            exit 0
          fi
          OUTPUT_NAME="$(cat data/autonomous_output_name.txt)"
          WORKSPACE="data/client_executions/$OUTPUT_NAME"
          python -m company.specialist_orchestrator --brief data/autonomous_client_brief.json --workspace "$WORKSPACE" --rounds-per-role 3
          # Retry the specialist team with OpenAI if Gemini is unavailable.
          if [ "${AI_PROVIDER}" = "gemini" ] && [ -n "$OPENAI_API_KEY" ]; then
            if python - "$WORKSPACE/specialist_execution_report.json" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              r=json.loads(Path(sys.argv[1]).read_text())
              requested=r.get("roles_requested", [])
              raise SystemExit(0 if r.get("status")=="completed_with_limitations" and len(requested)>0 and r.get("roles_with_artifact")==len(requested) else 1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              echo "Gemini specialist pass completed; no fallback needed."
            else
              echo "Gemini specialist pass did not complete; retrying with OpenAI."
              AI_PROVIDER=openai python -m company.specialist_orchestrator --brief data/autonomous_client_brief.json --workspace "$WORKSPACE" --rounds-per-role 3
            fi
          fi
      - name: Enforce truthful agent completion status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/client_executions") / Path("data/autonomous_output_name.txt").read_text().strip()
          problems = []
          required = {
              "agent_run_report.json": {"completed"},
              "specialist_execution_report.json": {"completed_with_limitations"},
          }
          for filename, accepted in required.items():
              path = root / filename
              if not path.is_file():
                  problems.append(f"{filename}: missing")
                  continue
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  problems.append(f"{filename}: invalid report ({type(exc).__name__})")
                  continue
              status = report.get("status")
              print(f"{filename}: status={status!r}")
              if status not in accepted:
                  problems.append(f"{filename}: status={status!r}, expected one of {sorted(accepted)}")
              if filename == "agent_run_report.json":
                  tool_calls = report.get("tool_calls", 0)
                  print(f"main agent tool calls: {tool_calls}")
                  if not isinstance(tool_calls, int) or tool_calls < 1:
                      problems.append("main agent reported no successful tool calls")
              if filename == "specialist_execution_report.json":
                  requested = report.get("roles_requested", [])
                  completed = report.get("roles_with_artifact", 0)
                  attempted = report.get("roles_attempted", 0)
                  print(f"specialists: requested={len(requested)}, attempted={attempted}, with_artifacts={completed}")
                  if completed != len(requested):
                      problems.append(f"specialists incomplete: {completed}/{len(requested)} role artifacts")
          if problems:
              print("AGENT EXECUTION NOT COMPLETE:")
              for problem in problems:
                  print(f"- {problem}")
              raise SystemExit(1)
          print("Agent and all required specialist passes report completion.")
          PY
      - name: Sync execution agent run to shared brain
        if: always()
        env:
          SHARED_BRAIN_AGENT_KEY: ${{ secrets.SHARED_BRAIN_AGENT_KEY }}
          SHARED_BRAIN_AGENT_ID: github-autonomous-client-execution
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ -n "$SHARED_BRAIN_AGENT_KEY" ]; then
            python -m company.shared_brain_sync --status "${RUN_STATUS,,}"
          else
            echo "Shared brain sync skipped: SHARED_BRAIN_AGENT_KEY secret is not configured."
          fi
      - name: Upload execution bundle for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinglab03-autonomous-client-review-${{ github.run_id }}
          path: data/client_executions/
          if-no-files-found: error
          retention-days: 14
