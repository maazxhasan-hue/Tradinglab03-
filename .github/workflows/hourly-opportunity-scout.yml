name: Hourly Opportunity Scout

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      HAS_FREELANCER_API_TOKEN: ${{ secrets.FREELANCER_API_TOKEN != '' }}
    timeout-minutes: 8
    concurrency:
      group: tradinglab03-lead-tracker
      cancel-in-progress: false
    steps:
      - name: Check out company repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional Freelancer API SDK when token is configured
        if: env.HAS_FREELANCER_API_TOKEN == 'true'
        run: python -m pip install 'freelancersdk>=0.1,<0.2'
      - name: Run opportunity qualification tests
        run: python -m unittest discover -s tests -p 'test_opportunity_*.py' -v
      - name: Discover public project listings
        env:
          FREELANCER_API_TOKEN: ${{ secrets.FREELANCER_API_TOKEN }}
        run: python -m company.opportunity_scout
      - name: Import suitable listings into persistent lead tracker
        run: python -m company.opportunity_importer
      - name: Upload opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: tradinglab03-opportunities-${{ github.run_id }}
          path: data/opportunities/
          if-no-files-found: error
          retention-days: 14
      - name: Commit updated persistent lead tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/leads.json
          git diff --cached --quiet && { echo "No lead changes to commit"; exit 0; }
          git commit -m "Import verified-priority opportunities into lead tracker"
          git push origin HEAD:main
