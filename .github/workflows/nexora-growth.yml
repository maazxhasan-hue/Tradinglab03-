name: Nexora Growth HQ Tests
on:
  pull_request:
    paths:
      - 'company/nexora_growth_runtime.py'
      - 'company/nexora_agent_executor.py'
      - 'tests/test_nexora_growth_runtime.py'
      - 'private_hq_server.py'
      - 'private-hq/growth-hq.html'
      - '.github/workflows/nexora-growth.yml'
  push:
    branches: [main]
    paths:
      - 'company/nexora_growth_runtime.py'
      - 'tests/test_nexora_growth_runtime.py'
      - 'private_hq_server.py'
      - 'private-hq/growth-hq.html'
      - '.github/workflows/nexora-growth.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q company private_hq_server.py tests
      - name: Run workflow and approval tests
        run: python -m unittest discover -s tests -p 'test_nexora_growth_runtime.py' -v
      - name: Check dashboard is included and remains paused
        run: |
          grep -q 'growth-hq.html' private_hq_server.py
          grep -q 'GROWTH_ENABLED.*false' private_hq_server.py
          grep -q 'SAFE MODE: ON' private-hq/growth-hq.html
