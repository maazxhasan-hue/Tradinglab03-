name: Shared Brain Workflow Registry

on:
  workflow_run:
    workflows:
      - AI Draft Worker
      - Autonomous Client Execution
      - Client Delivery Builder
      - Free Client Proposal Pack
      - Website Draft Builder
      - Daily Company Operations Report
      - Hourly Opportunity Scout
      - Harvey worker tests
      - Harvey health check
      - Company Health Check
      - Company Health Monitor
      - Company Operations Health Check
      - Company Quality Gate
      - Daily Client Opportunity Draft Queue
      - Delivery Pipeline Smoke Test
      - End-to-End Client Delivery Draft
      - Free Draft Worker Check
      - Nexora AI Acceptance Checks
      - Nexora Instagram Draft Pack
      - Nexora Intake Quality Gate
      - Nexora Live Smoke Check
      - Nexora AI Synthetic End-to-End Delivery Test
      - Opportunity Qualification Tests
      - Production Smoke Checks
      - Synthetic Client Delivery Validation
      - Instagram Content Pack (Approval Required)
      - Instagram Draft Pack
      - Lead Tracker
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  register-run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Register completed workflow run in shared brain
        env:
          SHARED_BRAIN_AGENT_ID: github-workflow-registry
          SHARED_BRAIN_STRICT: "1"
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || github.workflow }}
          SOURCE_STATUS: ${{ github.event.workflow_run.conclusion || 'success' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
        run: |
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexora-shared-brain"
          OIDC_RESPONSE="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL")"
          export SHARED_BRAIN_GITHUB_OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$SHARED_BRAIN_GITHUB_OIDC_TOKEN" ]; then
            echo "::error::GitHub OIDC token request returned an empty token."
            exit 1
          fi
          STATUS="$SOURCE_STATUS"
          case "$STATUS" in
            success|failure|cancelled|skipped)
              ;;
            *)
              STATUS=unknown
              ;;
          esac
          python -m company.shared_brain_sync --status "$STATUS" --run-id "$SOURCE_RUN_ID" --commit "$SOURCE_SHA" --workflow "$SOURCE_WORKFLOW" --repository "$SOURCE_REPOSITORY"
