name: Client Delivery Builder
on:
  workflow_dispatch:
    inputs:
      lead_id:
        description: Optional saved lead ID classified as a client project
        required: false
        type: string
      business_name:
        description: Business name
        required: true
        type: string
      tagline:
        description: Approved tagline
        required: true
        type: string
      services:
        description: Comma-separated services for the draft website
        required: true
        type: string
      contact_email:
        description: Approved public contact email
        required: true
        type: string
      observed_need:
        description: Verified buyer need; required unless using lead_id
        required: false
        type: string
      evidence:
        description: Public source or evidence to review
        required: false
        type: string
      website_url:
        description: Existing HTTPS website, optional
        required: false
        type: string
      service:
        description: Service category
        required: true
        type: choice
        options:
          - business_website
          - landing_page
          - website_audit
          - seo_content
          - short_video
          - business_automation
      price_quote:
        description: Optional operator-entered quote; leave blank if unknown
        required: false
        type: string
      requirements_json:
        description: Optional exported detailed brief JSON from the HQ dashboard; maps client requirements and future features into the delivery pack
        required: false
        type: string
permissions:
  contents: read
jobs:
  build-delivery-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and write brief
        env:
          LEAD_ID: ${{ inputs.lead_id }}
          BUSINESS_NAME: ${{ inputs.business_name }}
          TAGLINE: ${{ inputs.tagline }}
          SERVICES: ${{ inputs.services }}
          CONTACT_EMAIL: ${{ inputs.contact_email }}
          OBSERVED_NEED: ${{ inputs.observed_need }}
          EVIDENCE: ${{ inputs.evidence }}
          WEBSITE_URL: ${{ inputs.website_url }}
          SERVICE: ${{ inputs.service }}
          PRICE_QUOTE: ${{ inputs.price_quote }}
          REQUIREMENTS_JSON: ${{ inputs.requirements_json }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os
          brief = {
              "lead_id": os.environ.get("LEAD_ID", "").strip(),
              "business_name": os.environ["BUSINESS_NAME"].strip(),
              "tagline": os.environ["TAGLINE"].strip(),
              "services": [x.strip() for x in os.environ["SERVICES"].split(",") if x.strip()],
              "contact_email": os.environ["CONTACT_EMAIL"].strip(),
              "observed_need": os.environ.get("OBSERVED_NEED", "").strip(),
              "evidence": os.environ.get("EVIDENCE", "").strip(),
              "website_url": os.environ.get("WEBSITE_URL", "").strip(),
              "service": os.environ["SERVICE"].strip(),
              "price_quote": os.environ.get("PRICE_QUOTE", "").strip(),
          }
          raw_requirements = os.environ.get("REQUIREMENTS_JSON", "").strip()
          if raw_requirements:
              try:
                  requirements = json.loads(raw_requirements)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"requirements_json must be valid JSON: {exc}")
              if not isinstance(requirements, dict):
                  raise SystemExit("requirements_json must be a JSON object")
              # Normalize the HQ dashboard export to the delivery pipeline schema.
              aliases = {
                  "client": "business_name",
                  "goal": "observed_need",
                  "project_type": "requested_project_type",
                  "target_audience": "target_audience",
                  "pages_screens_deliverables": "pages_screens_deliverables",
                  "version_1_must_have_features": "version_1_must_have_features",
                  "future_features_backlog": "future_features_backlog",
                  "design_direction_and_references": "design_direction_and_references",
                  "content_and_assets": "content_and_assets",
                  "integrations_and_data": "integrations_and_data",
                  "acceptance_criteria": "acceptance_criteria",
                  "budget_range": "budget_range",
                  "target_deadline": "target_deadline",
                  "post_launch_support": "post_launch_support",
                  "constraints_dependencies_exclusions": "constraints_dependencies_exclusions",
              }
              for source_key, target_key in aliases.items():
                  value = requirements.get(source_key)
                  if value not in (None, ""):
                      brief[target_key] = value
              if not brief.get("business_name") or not brief.get("observed_need"):
                  raise SystemExit("requirements_json must include client and goal")
          for key in ("business_name", "tagline", "contact_email"):
              if not brief[key]:
                  raise SystemExit(f"{key} must not be blank")
          if not brief["services"]:
              raise SystemExit("Provide at least one service")
          if not brief["lead_id"] and not brief["observed_need"]:
              raise SystemExit("Provide a verified observed_need or a saved client-project lead_id")
          if brief["website_url"] and not brief["website_url"].startswith("https://"):
              raise SystemExit("website_url must use HTTPS")
          with open("data/client_delivery_brief.json", "w", encoding="utf-8") as f:
              json.dump(brief, f, ensure_ascii=False, indent=2)
          PY
      - name: Build proposal, website, and QA report
        run: python -m company.delivery_pipeline --brief data/client_delivery_brief.json --output data/delivery_bundles/client-review
      - name: Confirm no outreach or deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/delivery_bundles/client-review")
          report = json.loads((root / "delivery_report.json").read_text(encoding="utf-8"))
          assert report["status"] == "ready_for_human_review", report
          assert report["sent"] is False
          assert report["production_deployment_enabled"] is False
          assert report["verified_revenue"] == 0
          for path in ("proposal.md", "proposal.json", "project_brief.md", "future_feature_backlog.md", "acceptance_checklist.md", "change_request_template.md", "handover_and_next_steps.md", "website/index.html", "website/quality_report.json"):
              assert (root / path).is_file(), f"Missing {path}"
          print("PASS: bundle is ready for human review only.")
          PY
      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinglab03-client-delivery-${{ github.run_id }}
          path: data/delivery_bundles/client-review/
          if-no-files-found: warn
          retention-days: 14
