name: Shared Brain Live Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "tests/shared_brain_live_smoke.py"
      - "tests/gemini_tool_agent_live_smoke.py"
      - "tests/shared_brain_role_matrix.py"
      - ".github/workflows/shared-brain-live-smoke.yml"
      - ".github/workflows/nexora-release-gates.yml"
      - "company/shared_brain.py"
      - "company/shared_brain_sync.py"
      - "company/agent_runtime.py"
      - "company/tool_agent.py"
      - "company/nexora_agent_executor.py"
      - "company/nexora_batch_executor.py"
      - "company/nexora_growth_runtime.py"
      - "company/production_health.py"
      - "private_hq_server.py"
      - "Dockerfile.private-hq"
      - "supabase/functions/shared-brain/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify live Gemini native tool calling
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta' }}
        run: python tests/gemini_tool_agent_live_smoke.py

  shared-brain-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify live Shared Brain write, cross-agent recall, and specialist role matrix
        env:
          SHARED_BRAIN_AGENT_ID: shared-brain-smoke-test
        run: |
          OIDC_URL="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nexora-shared-brain"
          OIDC_RESPONSE="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$OIDC_URL")"
          export SHARED_BRAIN_GITHUB_OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          if [ -z "$SHARED_BRAIN_GITHUB_OIDC_TOKEN" ]; then
            echo "::error::GitHub OIDC token request returned an empty token."
            exit 1
          fi
          set +e
          python tests/shared_brain_live_smoke.py
          smoke_status=$?
          python tests/shared_brain_role_matrix.py
          matrix_status=$?
          if [ "$smoke_status" -ne 0 ] || [ "$matrix_status" -ne 0 ]; then
            exit 1
          fi
# Re-run live model and Shared Brain checks whenever private runtime or release-gate code changes.
