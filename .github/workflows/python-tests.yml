name: Python Regression Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install project dependencies when declared
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          if [[ -f requirements-dev.txt ]]; then python -m pip install -r requirements-dev.txt; fi
          if [[ -f harvey-worker/requirements.txt ]]; then python -m pip install -r harvey-worker/requirements.txt; fi
          if [[ -f pyproject.toml ]]; then python -m pip install -e .; fi

      - name: Run regression suite
        run: python -m unittest discover -s tests -v
