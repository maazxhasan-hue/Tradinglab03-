name: Harvey health check

on:
  push:
    paths:
      - "harvey-worker/**"
      - "harvey-worker/tests/**"
      - "company/**"
      - "tests/shared_brain_live_smoke.py"
      - "company/shared_brain.py"
      - "company/shared_brain_sync.py"
      - "supabase/functions/shared-brain/**"
      - ".github/workflows/harvey-health.yml"
      - ".github/workflows/harvey-tests.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Harvey health endpoint
        shell: bash
        run: |
          set -uo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 https://tradinglab03.onrender.com/health -o health.json; then
              if python -c "import json; d=json.load(open('health.json')); assert d.get('status') == 'ready', d; assert d.get('shared_brain') == 'configured', {'shared_brain': d.get('shared_brain'), 'status': d.get('status')}; print('Harvey health OK; database:', d.get('database'), '; shared brain:', d.get('shared_brain'), '; email sending:', d.get('email_sending'))"; then
                ok=1
                break
              fi
            fi
            echo "Health attempt $attempt/12 failed; retrying in 10 seconds."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Harvey did not become healthy after 12 attempts."
            exit 1
          fi
      - name: Verify live model and Shared Brain connectivity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://tradinglab03.onrender.com/public-status -o public-status.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("public-status.json").read_text(encoding="utf-8"))
          if status.get("shared_brain") != "configured":
              raise SystemExit("Shared Brain is not configured on the production worker.")
          if status.get("shared_brain_connection") != "connected":
              raise SystemExit("Production worker cannot authenticate to Shared Brain; verify SHARED_BRAIN_AGENT_KEY matches the Supabase function secret.")
          if status.get("model_configured") is not True:
              raise SystemExit("Production model runtime is not configured.")
          agents = status.get("agents", {})
          roles = agents.get("roles", [])
          if not isinstance(roles, list) or not roles:
              raise SystemExit("No specialist roles are registered on the production worker.")
          counts = status.get("tasks", {}).get("by_status", {})
          print("Production readiness OK: Shared Brain connected; model configured; specialist roles:", len(roles))
          print("Task status counts:", json.dumps(counts, sort_keys=True))
          PY

      - name: Confirm protected endpoints reject unauthenticated access
        shell: bash
        run: |
          set -euo pipefail
          for path in metrics prospects approvals tasks email/status; do
            code=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://tradinglab03.onrender.com/$path")
            if [ "$code" != "401" ] && [ "$code" != "503" ]; then
              echo "Unexpected unauthenticated status $code for /$path"
              exit 1
            fi
          done
          echo "Protected endpoints reject unauthenticated requests."
