name: Harvey health check

on:
  push:
    paths:
      - "harvey-worker/**"
      - "harvey-worker/tests/**"
      - ".github/workflows/harvey-health.yml"
      - ".github/workflows/harvey-tests.yml"
  pull_request:
    paths:
      - "harvey-worker/**"
      - "harvey-worker/tests/**"
      - ".github/workflows/harvey-health.yml"
      - ".github/workflows/harvey-tests.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  check-tradinglab03:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for TradingLab03 worker health endpoint
        shell: bash
        run: |
          set -uo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 https://tradinglab03.onrender.com/health -o health.json; then
              if python -c "import json; d=json.load(open('health.json')); assert d.get('status') == 'ready', d; assert d.get('shared_brain') == 'configured', {'shared_brain': d.get('shared_brain'), 'status': d.get('status')}; print('TradingLab03 health OK; database:', d.get('database'), '; shared brain:', d.get('shared_brain'), '; email sending:', d.get('email_sending'))"; then
                ok=1
                break
              fi
            fi
            echo "Health attempt $attempt/12 failed; retrying in 10 seconds."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "TradingLab03 did not become healthy after 12 attempts."
            exit 1
          fi
      - name: Confirm protected endpoints reject unauthenticated access
        shell: bash
        run: |
          set -euo pipefail
          for path in metrics prospects approvals tasks email/status; do
            code=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://tradinglab03.onrender.com/$path")
            if [ "$code" != "401" ] && [ "$code" != "503" ]; then
              echo "Unexpected unauthenticated status $code for /$path"
              exit 1
            fi
          done
          echo "Protected endpoints reject unauthenticated requests."

  check-private-harvey-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit the separate Harvey Render service and report all readiness signals
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://nexora-harvey-worker.onrender.com"

          def get_json(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "Nexora-Harvey-Health/1.0"},
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return json.loads(response.read(256_000).decode("utf-8"))

          health = None
          status = None
          last_error = "not checked"
          for attempt in range(1, 7):
              try:
                  health = get_json("/health")
                  status = get_json("/public-status")
                  break
              except urllib.error.HTTPError as exc:
                  last_error = f"HTTP {exc.code}"
              except Exception as exc:
                  last_error = type(exc).__name__
              print(f"Harvey endpoint attempt {attempt}/6 failed: {last_error}")
              if attempt < 6:
                  time.sleep(10)

          if health is None or status is None:
              raise SystemExit("Could not read Harvey health and public status endpoints: " + last_error)

          roles = status.get("agents", {}).get("roles", [])
          summary = {
              "health_status": health.get("status"),
              "database": health.get("database"),
              "shared_brain_configured": health.get("shared_brain"),
              "model_configured": health.get("model_configured"),
              "api_auth_configured": health.get("api_auth_configured"),
              "shared_brain_connection": status.get("shared_brain_connection"),
              "public_model_configured": status.get("model_configured"),
              "specialist_roles": len(roles) if isinstance(roles, list) else 0,
          }
          print("Harvey readiness summary: " + json.dumps(summary, sort_keys=True))

          issues = []
          if health.get("status") != "ready":
              issues.append("health status is not ready")
          if health.get("database") != "postgresql":
              issues.append("persistent PostgreSQL database is not configured")
          if health.get("shared_brain") != "configured":
              issues.append("Shared Brain credentials are not configured")
          if health.get("model_configured") is not True or status.get("model_configured") is not True:
              issues.append("model provider is not configured")
          if health.get("api_auth_configured") is not True:
              issues.append("worker API authentication is not configured")
          if status.get("shared_brain_connection") != "connected":
              issues.append("authenticated Shared Brain recall failed")
          if not isinstance(roles, list) or not roles:
              issues.append("no specialist roles are registered")
          if issues:
              raise SystemExit("Harvey service readiness blockers: " + "; ".join(issues))

          print("PASS: Harvey Render service and authenticated Shared Brain recall are ready.")
          PY
