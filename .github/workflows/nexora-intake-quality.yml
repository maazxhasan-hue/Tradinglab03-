name: Nexora Intake Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "dashboard/inbox.html"
      - "private-hq/inbox.html"
      - "dashboard/login.html"
      - "dashboard/website.html"
      - "dashboard/marketing.html"
      - "dashboard/index.html"
      - ".github/workflows/nexora-intake-quality.yml"
      - ".github/workflows/deploy-intake-api.yml"
  pull_request:
    paths:
      - "worker/**"
      - "dashboard/inbox.html"
      - "private-hq/inbox.html"
      - "dashboard/login.html"
      - "dashboard/website.html"
      - "dashboard/marketing.html"
      - "dashboard/index.html"
      - ".github/workflows/nexora-intake-quality.yml"
      - ".github/workflows/deploy-intake-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-intake-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Worker syntax and intake safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < worker/index.js
      - name: Verify authenticated lead pipeline wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("worker/index.js").read_text(encoding="utf-8")
          inbox = Path("private-hq/inbox.html").read_text(encoding="utf-8")
          public_inbox = Path("dashboard/inbox.html").read_text(encoding="utf-8")
          readme = Path("worker/README.md").read_text(encoding="utf-8")
          public_site = Path("dashboard/website.html").read_text(encoding="utf-8")
          login_page = Path("dashboard/login.html").read_text(encoding="utf-8")
          auth_migration = Path("worker/migrations/0002_client_accounts.sql").read_text(encoding="utf-8")
          deploy_workflow = Path(".github/workflows/deploy-intake-api.yml").read_text(encoding="utf-8")
          required_worker = [
              'url.pathname.match(/^\\/api\\/admin\\/submissions\\/([^/]+)\\/status$/)',
              'statusMatch && request.method === "PATCH"',
              'auth !== "Bearer " + env.ADMIN_API_KEY',
              '"access-control-allow-methods": "GET, POST, PATCH, DELETE, OPTIONS"',
              '"proposal_ready"', '"in_progress"', '"delivered"', '"won"', '"lost"',
              'authMatch', 'async function handleAuth',
              '"Sign in before submitting a project request."',
          ]
          required_inbox = [
              'method:"PATCH"',
              '"/status"',
              'Won — verify payment separately',
              'Pipeline status',
          ]
          missing = [item for item in required_worker if item not in worker]
          missing += [item for item in required_inbox if item not in inbox]
          if "PRIVATE HQ HOSTING NOT CONFIGURED" not in public_inbox or "window.location.replace" in public_inbox or "api/admin/submissions" in public_inbox:
              missing.append("public owner inbox must remain a non-functional safe placeholder until private HQ access is configured")
          if '{"status": "paid"}' not in deploy_workflow or "unsupported status was rejected" not in deploy_workflow:
              missing.append("deployment workflow invalid-status end-to-end check")
          if "client_accounts" not in auth_migration or "client_sessions" not in auth_migration or "client_auth_attempts" not in auth_migration:
              missing.append("client account/session/rate-limit database migration")
          if "Payment reconciliation remains a separate" not in readme:
              missing.append("README payment-evidence disclaimer")
          if 'href="login.html?mode=signup&next=website.html%23project">Sign up to build' not in public_site or 'href="login.html?next=website.html%23project">Log in' not in public_site:
              missing.append("public login and signup links")
          if 'id="authForm"' not in login_page or '/api/auth/' not in login_page or "nexora_client_token" not in login_page:
              missing.append("client authentication page wiring")
          if missing:
              raise SystemExit("Missing intake safety/pipeline requirements: " + ", ".join(missing))
          print("PASS: status endpoint, owner authentication, CORS, inbox controls, and payment caveat are present.")
          PY
      - name: Check Nexora public-facing copy and recovery paths
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          site = Path("dashboard/website.html").read_text(encoding="utf-8")
          visible_site = re.sub(r"<script[^>]*>.*?</script>", " ", site, flags=re.I | re.S)
          visible_site = re.sub(r"<style[^>]*>.*?</style>", " ", visible_site, flags=re.I | re.S)
          visible_site = re.sub(r"<[^>]+>", " ", visible_site)
          privacy = Path("dashboard/privacy.html").read_text(encoding="utf-8")
          checks = {
              "public website has project enquiry form": 'id="projectForm"' in site,
              "public website section markup is balanced": site.count("<section") == site.count("</section>") and "<se<section" not in site,
              "public website has quality section": 'id="quality"' in site,
              "public website hides internal AI workflow details": "Agents help with the work" not in site and 'href="#agents"' not in site,
              "public website has no unrelated TradingLab03 contact": "TradingLab03" not in visible_site and "@tradinglab03" not in visible_site.lower(),
              "public website has no unrelated social contact": "instagram.com" not in site.lower() and "@tradinglab03" not in site.lower(),
              "failed intake tells users receipt is unconfirmed": "your enquiry may not have reached us" in site,
              "privacy notice uses Nexora branding": "Nexora AI" in privacy and "TradingLab03" not in privacy,
              "privacy notice has no dead support links": 'href="#project"' not in privacy and "instagram.com" not in privacy.lower(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if failed:
              raise SystemExit("Public-facing checks failed: " + "; ".join(failed))
          PY
      - name: Verify internal dashboard boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          marketing = Path("dashboard/marketing.html").read_text(encoding="utf-8")
          hq = Path("dashboard/index.html").read_text(encoding="utf-8")
          checks = {
              "marketing page remains safe while private HQ is unconfigured": "Marketing Studio temporarily unavailable" in marketing and "PRIVATE HQ HOSTING NOT CONFIGURED" in marketing,
              "HQ page remains safe while private HQ is unconfigured": "Company HQ is being reconnected" in hq and "PRIVATE HQ HOSTING NOT CONFIGURED" in hq,
              "marketing page is not indexed": 'name="robots" content="noindex' in marketing,
              "HQ page is not indexed": 'name="robots" content="noindex' in hq,
              "marketing placeholder does not expose internal API routes": "api/admin/submissions" not in marketing,
              "HQ placeholder does not expose internal API routes": "api/admin/submissions" not in hq,
              "public page does not expose internal marketing editor": '<article class="post"' not in marketing and "NO AUTO-PUBLISH" not in marketing,
          }
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Dashboard boundary checks failed: " + "; ".join(failed))
          PY
      - name: Check public page does not contain an owner key
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("dashboard/website.html", "dashboard/inbox.html"):
              source = Path(name).read_text(encoding="utf-8")
              if "TRADINGLAB03_ADMIN_API_KEY" in source or "ADMIN_API_KEY =" in source:
                  raise SystemExit("Possible owner secret reference found in public HTML: " + name)
          print("PASS: public HTML does not contain server-side owner-key variable names.")
          PY
