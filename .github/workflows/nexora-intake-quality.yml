name: Nexora Intake Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "dashboard/inbox.html"
      - "dashboard/website.html"
      - ".github/workflows/nexora-intake-quality.yml"
      - ".github/workflows/deploy-intake-api.yml"
  pull_request:
    paths:
      - "worker/**"
      - "dashboard/inbox.html"
      - "dashboard/website.html"
      - ".github/workflows/nexora-intake-quality.yml"
      - ".github/workflows/deploy-intake-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-intake-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Worker syntax and intake safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < worker/index.js
      - name: Verify authenticated lead pipeline wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("worker/index.js").read_text(encoding="utf-8")
          inbox = Path("dashboard/inbox.html").read_text(encoding="utf-8")
          readme = Path("worker/README.md").read_text(encoding="utf-8")
          deploy_workflow = Path(".github/workflows/deploy-intake-api.yml").read_text(encoding="utf-8")
          required_worker = [
              'url.pathname.match(/^\\/api\\/admin\\/submissions\\/([^/]+)\\/status$/)',
              'statusMatch && request.method === "PATCH"',
              'auth !== "Bearer " + env.ADMIN_API_KEY',
              '"access-control-allow-methods": "GET, POST, PATCH, DELETE, OPTIONS"',
              '"proposal_ready"', '"in_progress"', '"delivered"', '"won"', '"lost"',
          ]
          required_inbox = [
              'method:"PATCH"',
              '"/status"',
              'Won — verify payment separately',
              'Pipeline status',
          ]
          missing = [item for item in required_worker if item not in worker]
          missing += [item for item in required_inbox if item not in inbox]
          if '{"status": "paid"}' not in deploy_workflow or "unsupported status was rejected" not in deploy_workflow:
              missing.append("deployment workflow invalid-status end-to-end check")
          if "Payment reconciliation remains a separate" not in readme:
              missing.append("README payment-evidence disclaimer")
          if missing:
              raise SystemExit("Missing intake safety/pipeline requirements: " + ", ".join(missing))
          print("PASS: status endpoint, owner authentication, CORS, inbox controls, and payment caveat are present.")
          PY
      - name: Check Nexora public-facing copy and recovery paths
        run: |
          python - <<'PY'
          from pathlib import Path
          site = Path("dashboard/website.html").read_text(encoding="utf-8")
          privacy = Path("dashboard/privacy.html").read_text(encoding="utf-8")
          checks = {
              "public website has project enquiry form": 'id="projectForm"' in site,
              "public website has quality section": 'id="quality"' in site,
              "public website hides internal AI workflow details": "Agents help with the work" not in site and 'href="#agents"' not in site,
              "public website has no unrelated TradingLab03 contact": "TradingLab03" not in site and "tradinglab03" not in site.lower(),
              "public website has no unrelated social contact": "instagram.com" not in site.lower() and "@tradinglab03" not in site.lower(),
              "failed intake tells users receipt is unconfirmed": "your enquiry may not have reached us" in site,
              "privacy notice uses Nexora branding": "Nexora AI" in privacy and "TradingLab03" not in privacy,
              "privacy notice has no dead support links": 'href="#project"' not in privacy and "instagram.com" not in privacy.lower(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if failed:
              raise SystemExit("Public-facing checks failed: " + "; ".join(failed))
          PY
      - name: Check public page does not contain an owner key
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("dashboard/website.html", "dashboard/inbox.html"):
              source = Path(name).read_text(encoding="utf-8")
              if "TRADINGLAB03_ADMIN_API_KEY" in source or "ADMIN_API_KEY =" in source:
                  raise SystemExit("Possible owner secret reference found in public HTML: " + name)
          print("PASS: public HTML does not contain server-side owner-key variable names.")
          PY
