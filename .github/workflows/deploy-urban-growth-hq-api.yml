name: Deploy Urban Growth HQ API

on:
  workflow_dispatch:
  push:
    paths:
      - "urban-growth-hq/api/**"
      - ".github/workflows/deploy-urban-growth-hq-api.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urban-growth-hq/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Validate required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URBAN_GROWTH_D1_DATABASE_ID: ${{ secrets.URBAN_GROWTH_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1)
          test -n "$URBAN_GROWTH_D1_DATABASE_ID" || (echo "Create the dedicated urban-growth-hq-leads D1 database first, then add its ID as URBAN_GROWTH_D1_DATABASE_ID"; exit 1)
      - name: Configure dedicated D1 database binding
        env:
          URBAN_GROWTH_D1_DATABASE_ID: ${{ secrets.URBAN_GROWTH_D1_DATABASE_ID }}
        run: |
          sed -i "s/REPLACE_WITH_NEW_URBAN_GROWTH_D1_DATABASE_ID/$URBAN_GROWTH_D1_DATABASE_ID/" wrangler.toml
          if grep -q REPLACE_WITH_NEW_URBAN_GROWTH_D1_DATABASE_ID wrangler.toml; then exit 1; fi
      - name: Apply database schema
        run: npx wrangler d1 execute urban-growth-hq-leads --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
