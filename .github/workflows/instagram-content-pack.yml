name: Instagram Content Pack (Approval Required)

on:
  workflow_dispatch:
    inputs:
      account:
        description: Content brand
        required: true
        type: choice
        options:
          - tradinglab03
          - nexora_ai
      topic:
        description: Topic or content theme
        required: true
        type: string
        default: "AI services for small businesses"
      offer:
        description: Real offer or service
        required: true
        type: string
        default: "Website and automation services; educational only, no outcome guarantees"
      audience:
        description: Intended audience
        required: true
        type: string
        default: "Beginners and small-business owners"
      cta:
        description: Call to action
        required: true
        type: string
        default: "Save this for later and ask a question in the comments."

permissions:
  contents: read

jobs:
  draft-content:
    name: Generate reviewable drafts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate seven-post pack
        env:
          ACCOUNT: ${{ inputs.account }}
          TOPIC: ${{ inputs.topic }}
          OFFER: ${{ inputs.offer }}
          AUDIENCE: ${{ inputs.audience }}
          CTA: ${{ inputs.cta }}
        run: |
          python company/instagram_content_pack.py \
            --account "$ACCOUNT" \
            --topic "$TOPIC" \
            --offer "$OFFER" \
            --audience "$AUDIENCE" \
            --cta "$CTA"
      - name: Upload drafts for review
        uses: actions/upload-artifact@v4
        with:
          name: instagram-content-pack-${{ github.run_id }}
          path: data/instagram_content_packs/
          if-no-files-found: error
          retention-days: 14
