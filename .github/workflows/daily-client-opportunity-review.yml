name: Daily Client Opportunity Draft Queue

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "company/client_opportunity_review.py"
      - "company/client_pipeline.py"
      - "company/daily_company_review.py"
      - "config/opportunity_sources.json"
      - "data/leads.json"
      - "tests/test_client_opportunity_review.py"
      - ".github/workflows/daily-client-opportunity-review.yml"

permissions:
  contents: read

concurrency:
  group: daily-client-opportunity-review
  cancel-in-progress: false

jobs:
  prepare-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout TradingLab03
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Prepare proposal drafts for policy-eligible client-project leads
        run: python -m company.client_opportunity_review
      - name: Upload review-only proposal drafts
        uses: actions/upload-artifact@v7
        with:
          name: tradinglab03-client-draft-queue-${{ github.run_id }}
          path: data/client_packs/daily_review/
          if-no-files-found: error
          retention-days: 14
