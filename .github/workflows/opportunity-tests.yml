name: Opportunity Qualification Tests

on:
  push:
    branches: [main]
    paths:
      - "company/opportunity_scout.py"
      - "company/opportunity_importer.py"
      - "tests/test_opportunity_*.py"
      - ".github/workflows/opportunity-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run opportunity qualification tests
        run: python -m unittest discover -s tests -p 'test_opportunity_*.py' -v
