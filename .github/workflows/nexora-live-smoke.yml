name: Nexora Live Smoke Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/website.html"
      - "worker/index.js"
      - "index.html"
      - ".github/workflows/nexora-live-smoke.yml"

permissions:
  contents: read

concurrency:
  group: nexora-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare Pages production pages and intake health
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          checks = {
              "Cloudflare Pages public homepage": ("https://nexora-ai-public.pages.dev/", "Nexora AI", "canonical"),
              "Cloudflare Pages project workspace": ("https://nexora-ai-public.pages.dev/dashboard/website.html", "Nexora AI", "projectForm"),
              "Cloudflare Pages client login": ("https://nexora-ai-public.pages.dev/dashboard/login.html", "Client workspace", "authForm"),
              "Cloudflare Pages privacy notice": ("https://nexora-ai-public.pages.dev/privacy.html", "Privacy notice", "Nexora AI"),
              "Cloudflare Pages sitemap": ("https://nexora-ai-public.pages.dev/sitemap.xml", "urlset", "nexora-ai-public.pages.dev"),
              "Intake API health": ("https://tradinglab03-intake.maazxhasan.workers.dev/health", '"ok":true', '"storage":"ready"'),
          }
          failures = []
          for label, (url, marker_a, marker_b) in checks.items():
              last = "not checked"
              for attempt in range(6):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Nexora-Live-Smoke/1.0", "Accept": "text/html,application/json,application/xml"})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read(1_000_000).decode("utf-8", "replace")
                          status = response.status
                      if status != 200:
                          last = f"HTTP {status}"
                      elif marker_a not in body or marker_b not in body:
                          last = "HTTP 200 but expected production content markers are missing"
                      else:
                          print(f"PASS: {label} — HTTP {status}; expected markers present")
                          last = None
                          break
                  except Exception as exc:
                      last = f"{type(exc).__name__}: {exc}"
                  time.sleep(5)
              if last:
                  print(f"FAIL: {label} — {last}")
                  failures.append(label)

          # Ensure private/admin paths are not exposed on the public Cloudflare Pages site.
          for path in ("/private-hq", "/private-hq/inbox.html", "/owner-console", "/admin.html", "/dashboard/inbox.html", "/dashboard/marketing.html"):
              url = "https://nexora-ai-public.pages.dev" + path
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Nexora-Live-Smoke/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  status = exc.code
              except Exception as exc:
                  print(f"FAIL: protected path check {path} — {type(exc).__name__}: {exc}")
                  failures.append("protected path " + path)
                  continue
              if status != 404:
                  print(f"FAIL: protected path {path} returned HTTP {status}, expected 404")
                  failures.append("protected path " + path)
              else:
                  print(f"PASS: protected path {path} — HTTP 404")

          if failures:
              raise SystemExit("Live production smoke check failed: " + ", ".join(failures))
          print("All Cloudflare Pages production page, private-path, and intake health checks passed.")
          PY

      - name: Verify Cloudflare Pages origin is allowed by intake CORS
        run: |
          python - <<'PY'
          import urllib.request
          endpoint = "https://tradinglab03-intake.maazxhasan.workers.dev"
          origin = "https://nexora-ai-public.pages.dev"
          req = urllib.request.Request(
              endpoint + "/api/auth/login",
              method="OPTIONS",
              headers={
                  "Origin": origin,
                  "Access-Control-Request-Method": "POST",
                  "Access-Control-Request-Headers": "authorization,content-type",
                  "User-Agent": "Nexora-Live-Smoke/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              allow_origin = response.headers.get("Access-Control-Allow-Origin", "")
              allow_methods = response.headers.get("Access-Control-Allow-Methods", "")
              allow_headers = response.headers.get("Access-Control-Allow-Headers", "")
              if response.status != 204 or allow_origin != origin or "POST" not in allow_methods or "content-type" not in allow_headers.lower():
                  raise SystemExit("Cloudflare Pages intake CORS preflight failed: expected HTTP 204 and matching allowed origin/method/headers.")
          print("PASS: Cloudflare Pages production origin is accepted by intake CORS.")
          PY
