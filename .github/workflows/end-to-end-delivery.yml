name: End-to-End Client Delivery Draft
on:
  workflow_dispatch:
    inputs:
      business_name:
        description: Business name (use only authorized, accurate details)
        required: true
        type: string
      tagline:
        description: Approved tagline
        required: true
        type: string
      services:
        description: Comma-separated approved services
        required: true
        type: string
      contact_email:
        description: Approved public contact email
        required: true
        type: string
      observed_need:
        description: Specific need from a brief or verified public source
        required: true
        type: string
      evidence:
        description: Evidence/source to verify
        required: false
        type: string
      website_url:
        description: Existing public HTTPS website, if any
        required: false
        type: string
      service:
        description: Proposal service category
        required: true
        type: choice
        options:
          - business_website
          - landing_page
          - website_audit
          - seo_content
          - short_video
          - business_automation
      price_quote:
        description: Optional operator-entered indicative quote
        required: false
        type: string
permissions:
  contents: read
jobs:
  build-review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Write brief safely
        env:
          BUSINESS_NAME: ${{ inputs.business_name }}
          TAGLINE: ${{ inputs.tagline }}
          SERVICES: ${{ inputs.services }}
          CONTACT_EMAIL: ${{ inputs.contact_email }}
          OBSERVED_NEED: ${{ inputs.observed_need }}
          EVIDENCE: ${{ inputs.evidence }}
          WEBSITE_URL: ${{ inputs.website_url }}
          SERVICE: ${{ inputs.service }}
          PRICE_QUOTE: ${{ inputs.price_quote }}
        run: |
          python - <<'PY'
          import json, os
          brief = {
              "business_name": os.environ["BUSINESS_NAME"],
              "tagline": os.environ["TAGLINE"],
              "services": [x.strip() for x in os.environ["SERVICES"].split(",") if x.strip()],
              "contact_email": os.environ["CONTACT_EMAIL"],
              "observed_need": os.environ["OBSERVED_NEED"],
              "evidence": os.environ.get("EVIDENCE", ""),
              "website_url": os.environ.get("WEBSITE_URL", ""),
              "service": os.environ["SERVICE"],
              "price_quote": os.environ.get("PRICE_QUOTE", ""),
          }
          with open("data/delivery_brief.json", "w", encoding="utf-8") as f:
              json.dump(brief, f, ensure_ascii=False)
          PY
      - name: Run end-to-end proposal + website build and QA
        run: python -m company.delivery_pipeline --brief data/delivery_brief.json --output data/delivery_bundles/review
      - name: Upload review bundle (no outreach or deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradinglab03-delivery-review-${{ github.run_id }}
          path: data/delivery_bundles/review/
          if-no-files-found: warn
          retention-days: 14
