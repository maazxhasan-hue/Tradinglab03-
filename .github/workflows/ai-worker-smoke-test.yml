name: AI Worker Smoke Test
on:
  push:
    branches: [main]
    paths:
      - "harvey-worker/**"
      - "public-site/studio-agent.html"
      - "public-site/video-studio.html"
      - ".github/workflows/ai-worker-smoke-test.yml"
  pull_request:
    paths:
      - "harvey-worker/**"
      - "public-site/studio-agent.html"
      - "public-site/video-studio.html"
      - ".github/workflows/ai-worker-smoke-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harvey-worker/requirements.txt
      - name: Install worker and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r harvey-worker/requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q harvey-worker
      - name: Validate Studio Agent inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("public-site/studio-agent.html").read_text(encoding="utf-8")
          source += "\\n" + Path("public-site/video-studio.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in Studio Agent")
          out = Path("/tmp/nexora-inline-scripts")
          out.mkdir(exist_ok=True)
          for index, script in enumerate(scripts):
              target = out / f"script-{index}.js"
              target.write_text(script, encoding="utf-8")
              print(target)
          print(f"Extracted {len(scripts)} inline scripts")
          PY
          for script in /tmp/nexora-inline-scripts/*.js; do node --check "$script"; done
      - name: Run worker regression tests
        working-directory: harvey-worker
        run: python -m pytest -q tests
      - name: Verify live worker health endpoint
        env:
          WORKER_URL: https://tradinglab03.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ["WORKER_URL"].rstrip("/") + "/health"
          request = urllib.request.Request(url, headers={"User-Agent": "Nexora-Worker-Smoke-Test/1.0"})
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"Health endpoint returned HTTP {response.status}")
              body = json.loads(response.read().decode("utf-8"))
          if body.get("status") != "ready":
              raise SystemExit(f"Worker not ready: {body!r}")
          print("Live worker health OK; database:", body.get("database", "unknown"))
          PY
      - name: Verify production model, shared brain, and Studio Agent readiness
        env:
          WORKER_URL: https://tradinglab03.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ["WORKER_URL"].rstrip("/")
          def get(path):
              request = urllib.request.Request(base + path, headers={"User-Agent": "Nexora-Worker-Smoke-Test/1.0", "Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"{path} returned HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))
          health = get("/health")
          if health.get("status") != "ready":
              raise SystemExit("Production worker is not ready.")
          if health.get("api_auth_configured") is not True:
              raise SystemExit("Production worker API authentication is not configured.")
          status = get("/public-status")
          if status.get("shared_brain") != "configured" or status.get("shared_brain_connection") != "connected":
              raise SystemExit("Production Render worker cannot verify its own Shared Brain connection.")
          if status.get("model_configured") is not True:
              raise SystemExit("Production model runtime is not configured; live agent generation cannot be considered ready.")
          roles = status.get("agents", {}).get("roles", [])
          names = {role.get("name") for role in roles if isinstance(role, dict)}
          if "Studio Agent" not in names:
              raise SystemExit("Studio Agent is missing from the live worker role registry.")
          print("PASS: production API auth configured, Shared Brain connected, model runtime configured, and Studio Agent registered.")
          PY

      - name: Optional provider smoke test
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || vars.GEMINI_BASE_URL || vars.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || vars.GEMINI_MODEL || vars.OPENAI_MODEL }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "No LLM_API_KEY, GEMINI_API_KEY, or OPENAI_API_KEY GitHub secret configured; skipping provider-generation test. Unit and live health tests still ran, but live generation remains unverified."
            echo "### NOT VERIFIED: no provider key available to CI" >> "$GITHUB_STEP_SUMMARY"
            echo "No provider secret was available to this workflow. Code and health checks ran, but live model generation was not tested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +x
          BASE_URL="${LLM_BASE_URL:-https://api.openai.com/v1}"
          BASE_URL="${BASE_URL%/}"
          if [[ "$BASE_URL" == *"generativelanguage.googleapis.com"* ]]; then
            MODEL="${LLM_MODEL:-gemini-2.5-flash}"
          else
            MODEL="${LLM_MODEL:-gpt-4.1-mini}"
          fi
          code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 45 "$BASE_URL/chat/completions" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: Nexora worker test OK\"}],\"max_tokens\":20,\"temperature\":0}")
          echo "Provider API HTTP status: $code"
          if [ "$code" != "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path("response.json").read_text())
              err = data.get("error", {})
              print("Provider error type:", err.get("type", "unknown"))
              print("Provider error code:", err.get("code", "unknown"))
              print("Provider error message:", err.get("message", "No details returned"))
          except Exception:
              print("Could not parse provider error response.")
          PY
            quota_state=$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path("response.json").read_text())
              error = data.get("error", {})
              code = str(error.get("code", "")).lower()
              kind = str(error.get("type", "")).lower()
              if code in {"credit_balance_exhausted", "insufficient_quota"} or kind == "insufficient_quota":
                  print("quota_blocked")
              else:
                  print("provider_error")
          except Exception:
              print("provider_error")
          PY
          )
            if [ "$quota_state" = "quota_blocked" ]; then
              echo "::error::Provider credentials are accepted but the account has no usable API credits. Live AI generation is blocked until provider billing/credits are restored."
              echo "### BLOCKED: AI provider quota exhausted" >> "$GITHUB_STEP_SUMMARY"
              echo "Worker code tests and live health passed, but live model generation is blocked because the provider reports insufficient quota / exhausted credits. Restore provider credits and rerun this workflow. This check intentionally fails instead of reporting a green smoke test." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("response.json").read_text())
          choices = data.get("choices", [])
          if not choices or not choices[0].get("message", {}).get("content", "").strip():
              raise SystemExit("Provider returned no assistant text.")
          print("Provider smoke test OK; model:", data.get("model", "unspecified"))
          PY
