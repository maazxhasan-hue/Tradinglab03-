name: Free Draft Worker Check
on:
  push:
    branches: [main]
    paths:
      - "company/agent_runtime.py"
      - ".github/workflows/free-worker-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Generate a sample draft without API calls
        env:
          AI_PROVIDER: template
        run: |
          python -m company.agent_runtime --task-type draft_proposal --title "Free worker self-check" --context "A small business needs a five-section landing page and mobile-friendly layout."
          python -m company.agent_runtime --run-one
          test -s data/agent_outputs/task-1.md
          grep -q "free template mode" data/agent_outputs/task-1.md
      - name: Upload self-check draft
        uses: actions/upload-artifact@v4
        with:
          name: free-worker-check-${{ github.run_id }}
          path: data/agent_outputs/
          if-no-files-found: error
          retention-days: 7
