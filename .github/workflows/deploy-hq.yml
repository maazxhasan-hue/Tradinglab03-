name: Validate HQ Source (Vercel owns private deployment)

on:
  push:
    branches: [main]
    paths:
      - "private-hq/**"
      - "dashboard/**"
      - ".github/workflows/deploy-hq.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hq-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check website chat widget
        run: node --check dashboard/chat-widget.js

      - name: Syntax-check visitor analytics dashboard script
        run: node --check private-hq/visitor-analytics-ui.js

      - name: Syntax-check HQ inline scripts and verify roster
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          hq_path = Path("private-hq/agent-town.html")
          hq = hq_path.read_text(encoding="utf-8")
          match = re.search(r"const roles=\[(.*?)\n\];", hq, re.S)
          if not match:
              raise SystemExit("Could not find the HQ role roster")
          roles = re.findall(r'^\["', match.group(1), re.M)
          if len(roles) != 31:
              raise SystemExit(f"Expected 31 roles (30 core + Instagram), found {len(roles)}")
          for required in ("NAMAZ ROOM", "SERVER ROOM", "voiceToggle", "Instagram Growth Agent"):
              if required not in hq:
                  raise SystemExit(f"Missing required HQ feature: {required}")

          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", hq, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline scripts found in private HQ")
          for index, script in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as tmp:
                  tmp.write(script)
                  tmp.flush()
                  subprocess.run(["node", "--check", tmp.name], check=True)
              print(f"PASS: HQ inline script {index} syntax")
          print("PASS: 31-role roster, internal creative agent, Instagram station, Namaz room, server room, and voice control")

          # Validate Company HQ inline scripts, including the interactive neural renderer.
          index_html = Path("private-hq/index.html").read_text(encoding="utf-8")
          index_scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", index_html, re.I | re.S)
          if not index_scripts:
              raise SystemExit("No inline scripts found in Company HQ index")
          for index, script in enumerate(index_scripts, 1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as tmp:
                  tmp.write(script)
                  tmp.flush()
                  subprocess.run(["node", "--check", tmp.name], check=True)
              print(f"PASS: Company HQ inline script {index} syntax")
          for required in ('data-neural="agents"', 'data-neural="brain"', "pointermove", "Shared Brain / Memory Topology"):
              if required not in index_html:
                  raise SystemExit(f"Missing neural HQ feature: {required}")
          print("PASS: interactive agent + Brain visualizations and HQ JavaScript syntax")
          PY
