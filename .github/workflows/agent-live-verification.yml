name: Nexora agent live verification

on:
  pull_request:
    paths:
      - "tests/harvey_agent_live_smoke.py"
      - "tests/test_harvey_agent_live_smoke.py"
      - ".github/workflows/agent-live-verification.yml"
  push:
    branches: [main]
    paths:
      - "tests/harvey_agent_live_smoke.py"
      - "tests/test_harvey_agent_live_smoke.py"
      - ".github/workflows/agent-live-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test live-smoke safety and result validation
        run: python -m unittest tests/test_harvey_agent_live_smoke.py -v

  live-agent:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run one bounded production specialist task
        env:
          HARVEY_API_KEY: ${{ secrets.HARVEY_API_KEY }}
          HARVEY_WORKER_URL: https://nexora-harvey-worker.onrender.com
        run: |
          set +x
          python tests/harvey_agent_live_smoke.py
