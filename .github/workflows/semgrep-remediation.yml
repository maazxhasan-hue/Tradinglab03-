name: Semgrep Remediation Agent

on:
  workflow_dispatch:
    inputs:
      max_findings:
        description: Maximum number of findings to ask the fixer to address (small batches are safer)
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "8"
        default: "5"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semgrep-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propose-and-validate-fixes:
    name: Propose backend fixes and validate them
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan backend Python code
        id: scan
        shell: bash
        run: |
          mkdir -p data/semgrep
          set +e
          docker run --rm \
            --volume "${{ github.workspace }}:/src" \
            --workdir /src \
            semgrep/semgrep:latest \
            semgrep scan --config p/python --config p/security-audit \
              --include '*.py' --metrics=off --json \
              --output data/semgrep/backend-findings.json \
              company harvey-worker private_hq_server.py
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "Semgrep scanner failed with exit code $status" > data/semgrep/scanner-error.txt
            exit "$status"
          fi
          echo "Findings scan complete (Semgrep exit code: $status)."

      - name: Generate bounded remediation patch or report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAX_FINDINGS: ${{ inputs.max_findings }}
        run: |
          python company/semgrep_fix_agent.py \
            --findings data/semgrep/backend-findings.json \
            --report data/semgrep/remediation-report.md \
            --patch data/semgrep/remediation.patch \
            --max-findings "$MAX_FINDINGS"

      - name: Validate patch and run regression checks
        id: validate
        shell: bash
        run: |
          if [ ! -s data/semgrep/remediation.patch ]; then
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            echo "No model patch was produced; keeping this run report-only."
            exit 0
          fi
          git apply --check data/semgrep/remediation.patch
          git apply data/semgrep/remediation.patch
          git diff --check
          python -m compileall -q company tests harvey-worker private_hq_server.py
          python -m unittest discover -s tests -v
          node --test worker/test_worker.mjs
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Create review pull request (never auto-merge)
        if: steps.validate.outputs.has_patch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="semgrep-fix-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add company harvey-worker tests private_hq_server.py
          if git diff --cached --quiet; then
            echo "Patch produced no changes; skipping pull request."
            exit 0
          fi
          git commit -m "fix: remediate Semgrep backend findings"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Review Semgrep backend remediation" \
            --body "## Automated remediation proposal

          - Generated from a bounded Semgrep finding batch by the manual remediation workflow.
          - Python compilation, unit tests, and Worker tests passed before this PR was created.
          - This PR is **not auto-merged**. Review the diff and CI results before merging.
          - Model output is untrusted; verify correctness and security independently.

          See the workflow artifact for the finding report and patch."

      - name: Upload scan and remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-backend-remediation-${{ github.run_id }}
          path: data/semgrep/
          if-no-files-found: warn
          retention-days: 14
