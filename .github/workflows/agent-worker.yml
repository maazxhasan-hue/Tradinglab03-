name: AI Draft Worker
on:
  workflow_dispatch:
    inputs:
      task_type:
        description: What should the AI draft?
        required: true
        type: choice
        options:
          - draft_proposal
          - draft_website_copy
          - summarize_opportunity
      title:
        description: Short task title
        required: true
        type: string
      context:
        description: Project brief or public listing text; never put secrets here
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create task and run one worker (free template mode)
        env:
          SHARED_BRAIN_AGENT_KEY: ${{ secrets.SHARED_BRAIN_AGENT_KEY }}
          SHARED_BRAIN_AGENT_ID: github-ai-draft-worker
          AI_PROVIDER: template
          TASK_TYPE: ${{ inputs.task_type }}
          TASK_TITLE: ${{ inputs.title }}
          TASK_CONTEXT: ${{ inputs.context }}
        run: |
          python -m company.agent_runtime --task-type "$TASK_TYPE" --title "$TASK_TITLE" --context "$TASK_CONTEXT"
          python -m company.agent_runtime --run-one
      - name: Sync agent run to shared brain
        if: always()
        env:
          SHARED_BRAIN_AGENT_KEY: ${{ secrets.SHARED_BRAIN_AGENT_KEY }}
          SHARED_BRAIN_AGENT_ID: github-ai-draft-worker
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ -n "$SHARED_BRAIN_AGENT_KEY" ]; then
            python -m company.shared_brain_sync --status "${RUN_STATUS,,}"
          else
            echo "Shared brain sync skipped: SHARED_BRAIN_AGENT_KEY secret is not configured."
          fi
      - name: Upload draft output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-draft-${{ github.run_id }}
          path: data/agent_outputs/
          if-no-files-found: warn
          retention-days: 14
