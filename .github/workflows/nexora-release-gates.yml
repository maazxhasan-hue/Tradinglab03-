name: Nexora Agent and Public Artifact Release Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "company/**"
      - "private_hq_server.py"
      - "private-hq/**"
      - "dashboard/**"
      - "public-site/**"
      - "Dockerfile.private-hq"
      - "render.yaml"
      - "tests/**"
      - ".github/workflows/nexora-release-gates.yml"
  push:
    branches: [main]
    paths:
      - "company/**"
      - "private_hq_server.py"
      - "private-hq/**"
      - "dashboard/**"
      - "public-site/**"
      - "Dockerfile.private-hq"
      - "render.yaml"
      - "tests/**"
      - ".github/workflows/nexora-release-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify provider-free agent queue fails closed
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from company.nexora_growth_runtime import GrowthStore
          from company.nexora_agent_executor import ProviderNotConfigured
          from company.nexora_batch_executor import start_all_agents
          with tempfile.TemporaryDirectory() as tmp:
              store = GrowthStore(Path(tmp) / "growth.sqlite3")
              try:
                  start_all_agents(store, {})
              except ProviderNotConfigured:
                  pass
              else:
                  raise SystemExit("Agent launch must fail closed without a configured provider.")
              assert store.list_tasks() == [], "No tasks should be queued without a provider."
          print("PASS: provider-free agent launch fails closed without creating tasks.")
          PY

  public-artifact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Copy the exact Render public-site artifact
        run: |
          set -eu
          test -d public-site
          test -f public-site/index.html
          rm -rf public-site-reviewed
          mkdir -p public-site-reviewed
          cp -a public-site/. public-site-reviewed/
      - name: Audit deployed public artifact for private source and credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("public-site-reviewed")
          assert (root / "index.html").is_file(), "Public homepage is missing."
          assert (root / "dashboard/analytics-consent.js").is_file(), "Homepage-referenced analytics asset is missing."

          forbidden = {
              ".git", ".github", "private-hq", "owner-console", "company",
              "config", "data", "worker", "harvey-worker", "botlab",
              "tests", "node_modules", "venv", ".venv",
          }
          path_errors = []
          content_errors = []
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bsk-or-v1-[A-Za-z0-9]{24,}\b"),
              re.compile(r"\bsb_secret_[A-Za-z0-9_-]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*['\"]?[^\s'\"]{20,}"),
          ]
          scanned = 0
          for item in root.rglob("*"):
              if not item.is_file():
                  continue
              rel = item.relative_to(root).as_posix()
              parts = set(Path(rel).parts)
              if parts & forbidden or item.name == "private_hq_server.py" or item.name.startswith(".env"):
                  path_errors.append(rel)
                  continue
              try:
                  text = item.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              scanned += 1
              for pattern in secret_patterns:
                  if pattern.search(text):
                      content_errors.append(rel)
                      break
          if path_errors:
              raise SystemExit("Private paths in deployed public artifact: " + ", ".join(path_errors))
          if content_errors:
              raise SystemExit("Credential-like material in public artifact: " + ", ".join(content_errors))
          files = sum(1 for p in root.rglob("*") if p.is_file())
          print(f"PASS: audited the actual Render publish directory ({files} files; {scanned} text files); no forbidden private paths or credential patterns found.")
          PY
      - name: Upload exact reviewed public artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexora-reviewed-public-site-${{ github.sha }}
          path: public-site-reviewed/
          if-no-files-found: error
          retention-days: 7
